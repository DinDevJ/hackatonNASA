<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVA · Simulador de misión</title>
<style>
:root{
  --bg:#070b14; --panel:#0f1626; --panel2:#141d31; --line:#22304a; --fg:#e7eef9; --dim:#8a9bb8;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; --earth:#38bdf8;
  --dev:#f43f5e; --cuerpo:#dbe4f0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b1222,#070b14)}
header h1{font-size:1.05rem;margin:0;letter-spacing:.02em}
header h1 span{color:var(--dim);font-weight:400}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--acc);color:#04111f;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:.85rem}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:.78rem;color:var(--dim);white-space:nowrap}
.pill b{color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:14px;padding:14px 16px}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
#escena{position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#101a30 0,#0b1222 55%,#080d18 100%)}
#escena svg{display:block;width:100%;height:auto}
.limite{display:flex;gap:10px;align-items:flex-start;margin:0 14px 14px;padding:10px 12px;border:1px solid #3a2330;background:rgba(244,63,94,.07);border-radius:10px;font-size:.82rem;color:#e9c9d1}
.limite b{color:#fff}
.limite i{flex:none;width:10px;height:10px;margin-top:5px;border-radius:2px;background:var(--dev)}

/* ── escena ── */
.cuerpo{fill:#111c31;stroke:var(--cuerpo);stroke-width:2.2;stroke-linejoin:round}
.disp{cursor:pointer}
.disp .forma{transition:filter .2s,opacity .2s}
.disp:hover .forma,.disp.sel .forma{filter:drop-shadow(0 0 6px rgba(244,63,94,.9))}
.disp:focus{outline:none}
.disp:focus-visible .forma{filter:drop-shadow(0 0 6px #60a5fa)}
.disp.apagado .forma{opacity:.25;filter:grayscale(1)}
.disp.sel .lbl{fill:#fff}
.equipo{cursor:pointer}
.equipo .marco{transition:stroke .2s}
.equipo:hover .marco,.equipo.sel .marco{stroke:#93c5fd}
.lbl{fill:var(--fg);font-size:13px;font-weight:650}
.sub{fill:#a9b8d2;font-size:11px}
.lbl,.sub{paint-order:stroke;stroke:#0b1222;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.rojo{fill:#fda4af}
.guia{stroke:#fb7185;stroke-width:1;stroke-dasharray:3 3;opacity:.7;pointer-events:none}
.ondas path{fill:none;stroke:var(--dev);stroke-width:2.2;stroke-linecap:round;animation:pulso 1.5s ease-in-out infinite;pointer-events:none}
.ondas path:nth-child(2){animation-delay:.18s}
.ondas path:nth-child(3){animation-delay:.36s}
.ondas.pc path{stroke:#93c5fd}
.ondas.claro path{stroke:#fff1f2}
.ondas.tierra path{stroke:var(--earth);animation-duration:2.4s}
.ondas.cortado path{stroke:#64748b;animation:none;opacity:.3}
@keyframes pulso{0%,100%{opacity:.12}35%{opacity:1}}
.enl{fill:none;stroke-width:1.5;stroke-dasharray:2 6;stroke:#334766}
.enl.vivo{stroke:#4b6a99;animation:flujo 1.6s linear infinite}
.enl.cortado{stroke:#7f1d1d}
@keyframes flujo{to{stroke-dashoffset:-16}}

/* ── panel ── */
#detalle{padding:16px;min-height:420px}
#detalle h2{margin:0 0 2px;font-size:1.05rem}
#detalle h3{margin:14px 0 2px;font-size:.9rem}
#detalle .rol{color:var(--dim);margin:0 0 12px;font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.met .k{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.met .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.met .v small{font-size:.75rem;color:var(--dim);font-weight:500}
label.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;font-size:.82rem;color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--dev)}
select,textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}
textarea{resize:vertical;min-height:60px}
.sw{display:flex;align-items:center;gap:10px;margin:10px 0}
.sw input{width:18px;height:18px;accent-color:var(--acc)}
pre.hex{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.72rem;overflow:auto;margin:8px 0 0;color:#9fd1ff}
.lista{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:260px;overflow:auto}
.item{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:8px;padding:7px 10px;font-size:.82rem}
.item.rojo{border-left-color:var(--bad)} .item.ambar{border-left-color:var(--warn)} .item.verde{border-left-color:var(--ok)}
.item.aviso{border-left-color:var(--earth)}
.item .t{color:var(--dim);font-size:.72rem}
.banda{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin:4px 0 10px}
.banda .rango{position:absolute;top:3px;bottom:3px;background:rgba(52,211,153,.22);border:1px solid rgba(52,211,153,.6);border-radius:4px}
.banda .esp{position:absolute;top:0;bottom:0;width:2px;background:var(--ok)}
.banda .act{position:absolute;top:-3px;width:10px;height:26px;margin-left:-5px;border-radius:3px;background:var(--fg)}
.banda .act.fuera{background:var(--bad)}
.var-h{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}
.var-h span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.pesos{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:-6px;margin-bottom:12px}
.pesos i{display:block}
.mide{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mide span{font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#fecdd3}
#log{grid-column:1/-1;padding:10px 14px;max-height:170px;overflow:auto;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
#log .e{color:var(--fg)} #log .a{color:var(--warn)} #log .r{color:var(--bad)} #log .ti{color:var(--earth)}
.nota{font-size:.75rem;color:var(--dim);margin-top:10px}
.cta{margin:14px 0 0;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:.85rem}
</style>
</head>

</header>

<script>
'use strict';
// ═══════════ Estado ═══════════
const DIA = 86400000;
const S = {
  lanzamiento: null, vivo: false, tramas: 0, temporizador: null, tic: 0,
  encendido: { playera: true, brazalete: true, reloj: true, cel: true },
  bleConectado: true, colaEsp: [], descartadas: 0, enviadasEsp: 0,
  seq: { 401: 0, 201: 0, reloj: 0 },
  anom: { fatiga: 0, taquipnea: 0, fiebre: 0, hipoxia: 0, hiper: 0 },
  contactoReloj: true,
  ultimos: {}, ultimoHex: { playera: '', brazalete: '' }, ultimosVar: {},
  alertas: [], bandeja: [], avisos: [], enlace: { owlt_s: 20, abierto: true },
  pred: [], sel: 'pc',
};
const BASAL = { fc: 62, spo2: 98, fr: 14, temp: 36.6, sis: 115, dia: 75 };
const DELTA = { fc: -0.08, spo2: -0.005, fr: -0.04, temp: 1.0, sis: -0.06, dia: -0.10 };
const NOMBRE = { '04:A4': 'Frecuencia cardiaca', '04:A3': 'SpO₂', '04:A2': 'Frec. respiratoria', '04:A1': 'Temperatura', '01:V1': 'PA sistólica', 'X:PAD': 'PA diastólica', 'X:PAM': 'PA media' };
// Dónde está cada cosa en la escena (para ondas y paquetes).
const POS = { playera: [294, 302], brazalete: [249, 263], reloj: [429, 405], cel: [670, 300], pc: [830, 138], tierra: [830, 460] };
const $ = (q) => document.querySelector(q);
const api = async (ruta, metodo = 'GET', cuerpo) => {
  const r = await fetch(ruta, { method: metodo, headers: { 'content-type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const hora = (iso) => new Date(iso).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// ═══════════ Perfil EVA en el navegador (igual que esquema.ts y trama_eva.h) ═══════════
const ESQ = {
  5: [['u8', 1], ['u8', 1], ['i16', 0.01]],   // playera: fc · fr · temp
  2: [['u8', 1], ['u8', 1]],                  // brazalete: sis · dia (la PA media la calcula la central)
};
const RANGO = { u8: [0, 255], i16: [-32768, 32767] };
function codificar(idDisp, idEsq, seq, tSeg, valores) {
  const campos = ESQ[idEsq];
  const tam = 13 + campos.reduce((s, [t]) => s + (t === 'u8' ? 1 : 2), 0);
  const b = new Uint8Array(tam), dv = new DataView(b.buffer);
  dv.setUint8(0, 1); dv.setUint32(1, idDisp, true); dv.setUint16(5, idEsq, true);
  dv.setUint16(7, seq & 0xffff, true); dv.setUint32(9, tSeg, true);
  let off = 13;
  campos.forEach(([t, esc], i) => {
    const [lo, hi] = RANGO[t];
    const crudo = Math.min(hi, Math.max(lo, Math.floor(valores[i] / esc + 0.5)));
    if (t === 'u8') { dv.setUint8(off, crudo); off += 1; } else { dv.setInt16(off, crudo, true); off += 2; }
  });
  return b;
}
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const hex = (u8) => [...u8].map((x) => x.toString(16).padStart(2, '0')).join(' ');

// ═══════════ Fisiología simulada ═══════════
function valor(v, t, conAnomalias) {
  const dia = (t - S.lanzamiento) / DIA, base = BASAL[v];
  const ruido = v === 'spo2' ? 0.006 : 0.035;
  if (dia < 0) return v === 'temp' ? base + 0.15 * gauss() : base * (1 + ruido * gauss());
  let x = v === 'temp' ? base + DELTA.temp + 0.2 * gauss() : base * (1 + DELTA[v] + ruido * gauss());
  if (v === 'fc' && dia < 3) x *= 1 + 0.05 * (1 - dia / 3);
  if (conAnomalias) {
    if (v === 'fc') x *= 1 + S.anom.fatiga / 100;
    if (v === 'fr') x *= 1 + S.anom.taquipnea / 100;
    if (v === 'spo2') x -= S.anom.hipoxia;
    if (v === 'temp') x += S.anom.fiebre;
    if (v === 'sis') x += S.anom.hiper;
    if (v === 'dia') x += S.anom.hiper * 0.6;
  }
  return x;
}
const lecturaPlayera = (t, a) => [valor('fc', t, a), valor('fr', t, a), valor('temp', t, a)];
const lecturaBrazalete = (t, a) => [valor('sis', t, a), valor('dia', t, a)];
function tramaReloj(t, a) {
  const fc = Math.round(valor('fc', t, a)), spo2 = Math.min(100, Math.round(valor('spo2', t, a) * 10) / 10);
  const q = { contacto: S.contactoReloj };
  return { fc, spo2, json: { frame: 'eva.telemetry.v1', source: { id: 'reloj-ana', kind: 'wrist' }, subject: 'ana',
    t_scet: new Date(Math.floor(t / 1000) * 1000).toISOString(), seq: S.seq.reloj++,
    samples: [{ var: '04:A4', value: fc, unit: 'bpm', origin: 'sensor', quality: q },
              { var: '04:A3', value: spo2, unit: '%', origin: 'sensor', quality: q }] } };
}

// ═══════════ Preparar misión: 119 días de historia ═══════════
async function preparar() {
  const b = $('#b-preparar'); b.disabled = true; $('#b-vivo').disabled = true;
  try {
    detener();
    await api('/api/demo/reiniciar', 'POST');
    S.alertas = []; S.bandeja = []; S.avisos = []; S.tramas = 0; S.colaEsp = []; S.seq = { 401: 0, 201: 0, reloj: 0 };
    S.lanzamiento = Date.now() - 112 * DIA;
    const inicioTierra = new Date(S.lanzamiento - 7 * DIA).toISOString();
    await api('/api/fases', 'POST', { desde: inicioTierra, entorno: 'tierra' });
    await api('/api/fases', 'POST', { desde: new Date(S.lanzamiento).toISOString(), entorno: 'orbita' });
    for (const d of [401, 201, 302]) await api('/api/asignaciones', 'POST', { dispositivo: d, tripulante: 'ana', desde: inicioTierra });
    log('e', 'Misión preparada: lanzamiento hace 112 días. Rellenando historia…');

    let bin = [], json = [];
    const enviar = async () => {
      if (bin.length) { await api('/api/tramas/binaria', 'POST', { b64: bin }); S.tramas += bin.length; bin = []; }
      if (json.length) { await api('/api/tramas', 'POST', json); S.tramas += json.length; json = []; }
      pintarCabecera();
    };
    for (let d = -7; d < 112; d++) {
      for (let k = 0; k < 12; k++) {
        const t = S.lanzamiento + d * DIA + (k + 0.5) * (DIA / 12), ts = Math.floor(t / 1000);
        bin.push(b64(codificar(401, 5, S.seq[401]++, ts, lecturaPlayera(t, false))));
        bin.push(b64(codificar(201, 2, S.seq[201]++, ts, lecturaBrazalete(t, false))));
        json.push(tramaReloj(t, false).json);
      }
      if (bin.length >= 480) { b.textContent = `Rellenando… día ${d}`; await enviar(); }
    }
    await enviar();
    log('e', `Historia lista: ${S.tramas} tramas de 119 días. LUNNA ya calibró a Ana (días 0–13).`);
    await refrescar();
    $('#b-vivo').disabled = false;
    iniciar();
  } catch (e) { log('r', 'Error al preparar: ' + e.message); }
  b.textContent = 'Preparar misión · 112 días'; b.disabled = false;
}

// ═══════════ En vivo: cada segundo ═══════════
function tick() {
  const t = Date.now(), ts = Math.floor(t / 1000), cada5 = S.tic++ % 5 === 0;

  // Playera: el ESP32 lee sus sensores y encola; sólo vacía la cola si hay Bluetooth.
  if (S.encendido.playera) { const v = lecturaPlayera(t, true); S.colaEsp.push({ ts, v }); S.ultimos.playera = v; }
  if (S.colaEsp.length > 1800) { S.descartadas += S.colaEsp.length - 1800; S.colaEsp.splice(0, S.colaEsp.length - 1800); }
  if (S.bleConectado && S.colaEsp.length) {
    const salen = S.colaEsp.splice(0, 40).map((r) => { const u8 = codificar(401, 5, S.seq[401]++, r.ts, r.v); S.ultimoHex.playera = hex(u8); return b64(u8); });
    S.enviadasEsp += salen.length;
    api('/api/tramas/binaria', 'POST', { b64: salen }).then(() => { S.tramas += salen.length; pintarCabecera(); }).catch((e) => log('r', e.message));
    paquete(POS.playera, POS.pc, '#fb7185');
  }

  // Brazalete: mide cada cierto tiempo y manda su propia trama por Bluetooth.
  if (cada5 && S.encendido.brazalete) {
    const v = lecturaBrazalete(t, true), u8 = codificar(201, 2, S.seq[201]++, ts, v);
    S.ultimos.brazalete = v; S.ultimoHex.brazalete = hex(u8);
    api('/api/tramas/binaria', 'POST', { b64: [b64(u8)] }).then(() => { S.tramas++; pintarCabecera(); }).catch(() => {});
    paquete(POS.brazalete, POS.pc, '#fb7185');
  }

  // Reloj: FC y SpO₂ cada 5 s, directo a la central.
  if (cada5 && S.encendido.reloj) {
    const r = tramaReloj(t, true);
    S.ultimos.reloj = [r.fc, r.spo2];
    api('/api/tramas', 'POST', r.json).then(() => { S.tramas++; pintarCabecera(); }).catch(() => {});
    paquete(POS.reloj, POS.pc, '#fb7185');
  }
  if (['playera', 'brazalete', 'reloj'].includes(S.sel)) pintarDetalle();
}
function iniciar() { if (S.temporizador) return; S.vivo = true; S.temporizador = setInterval(tick, 1000); pintarCabecera(); log('e', 'En vivo: la playera manda 1 trama por segundo; brazalete y reloj, 1 cada 5 s.'); }
function detener() { clearInterval(S.temporizador); S.temporizador = null; S.vivo = false; pintarCabecera(); }

// ═══════════ Ondas y paquetes ═══════════
const NS = 'http://www.w3.org/2000/svg';
function ondas(id, [cx, cy], [tx, ty], clase = '', radios = [12, 20, 28], abre = 0.5) {
  const g = document.createElementNS(NS, 'g'); g.id = 'o-' + id; g.setAttribute('class', 'ondas ' + clase);
  const a = Math.atan2(ty - cy, tx - cx);
  for (const r of radios) {
    const p = document.createElementNS(NS, 'path');
    const x1 = cx + r * Math.cos(a - abre), y1 = cy + r * Math.sin(a - abre), x2 = cx + r * Math.cos(a + abre), y2 = cy + r * Math.sin(a + abre);
    p.setAttribute('d', `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    g.appendChild(p);
  }
  $('#ondas').appendChild(g);
}
function paquete([x0, y0], [x1, y1], color, dur = 800, r = 4) {
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('r', r); c.setAttribute('fill', color); $('#paquetes').appendChild(c);
  const t0 = performance.now();
  (function paso(ahora) {
    const k = Math.min(1, (ahora - t0) / dur), e = k * k * (3 - 2 * k);
    c.setAttribute('cx', x0 + (x1 - x0) * e); c.setAttribute('cy', y0 + (y1 - y0) * e);
    c.setAttribute('opacity', k < 0.9 ? 1 : (1 - k) * 10);
    if (k < 1) requestAnimationFrame(paso); else c.remove();
  })(t0);
}
const aTierra = () => paquete([830, 222], [830, 458], '#38bdf8', 1600, 5);
const deTierra = () => paquete([830, 458], [830, 222], '#38bdf8', 1600, 5);

function conectarEventos() {
  const es = new EventSource('/api/stream');
  es.addEventListener('muestra', (e) => { const m = JSON.parse(e.data); S.ultimosVar[m.variable] = m.valor; });
  es.addEventListener('alerta', (e) => {
    const a = JSON.parse(e.data); S.alertas.unshift(a);
    const nivel = a.estado === 'rojo' ? 'r' : a.estado === 'ambar' ? 'a' : 'e';
    log(nivel, `LUNNA · ${a.estado.toUpperCase()} · ${NOMBRE[a.variable] || a.variable}: ${a.valor} (esperado ${a.esperado}, z=${a.z}, P(nominal)=${a.prob_nominal})`);
    $('#pc-onda').setAttribute('stroke', a.estado === 'rojo' ? '#f87171' : a.estado === 'ambar' ? '#fbbf24' : '#34d399');
    if (S.sel === 'pc') pintarDetalle();
  });
  es.addEventListener('tierra', (e) => {
    const b = JSON.parse(e.data); S.bandeja.unshift(b); aTierra();
    if (b.tipo === 'alerta') log('ti', `Tierra recibe alerta de ${b.datos.tripulante} (${b.datos.estado}), ocurrida a las ${hora(b.t_scet)}: llegó con ${Math.round((Date.parse(b.t_ert) - Date.parse(b.t_scet)) / 1000)} s de antigüedad`);
    if (S.sel === 'tierra') pintarDetalle();
  });
  es.addEventListener('aviso', (e) => {
    const a = JSON.parse(e.data); S.avisos.unshift(a); deTierra();
    if (S.encendido.cel) setTimeout(() => { paquete(POS.pc, POS.cel, '#38bdf8', 700, 5); $('#cel-badge').setAttribute('r', 6); }, 1600);
    log('ti', `Aviso de Tierra para ${a.para}: «${a.texto}» (redactado a las ${hora(a.t_redactado)})`);
    if (['cel', 'pc', 'tierra'].includes(S.sel)) pintarDetalle();
  });
  es.addEventListener('enlace', (e) => { S.enlace = JSON.parse(e.data); pintarEnlace(); });
  es.onerror = () => { $('#d-back').className = 'dot bad'; };
  es.onopen = () => { $('#d-back').className = 'dot ok'; };
}

  try { S.pred = await api('/api/prediccion/ana'); } catch {}

const mide = (...xs) => `<div class="mide">${xs.map((x) => `<span>${x}</span>`).join('')}</div>`;

function pintarDetalle() {
  const foco = document.activeElement;
  if (foco && (foco.tagName === 'TEXTAREA' || (foco.tagName === 'INPUT' && foco.type === 'range'))) return; // no interrumpir al usuario
  $('#detalle').innerHTML = VISTAS[S.sel]();
  conectarControles();
}

function conectarControles() {
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.addEventListener('change', f); };
  const NOM = { playera: 'Playera', brazalete: 'Brazalete', reloj: 'Reloj', cel: 'Smartphone' };
  for (const k of Object.keys(NOM)) on('s-' + k, (e) => { S.encendido[k] = e.target.checked; pintarEnlacesLocales(); log('e', `${NOM[k]} ${e.target.checked ? 'encendido' : 'apagado'}`); });
  on('s-ble', (e) => { S.bleConectado = e.target.checked; pintarEnlacesLocales(); log(S.bleConectado ? 'e' : 'a', S.bleConectado ? `Bluetooth reconectado: el ESP32 vacía ${S.colaEsp.length} lecturas guardadas` : 'Bluetooth cortado: el ESP32 de la playera empieza a guardar lecturas'); pintarDetalle(); });
  on('s-contacto', (e) => { S.contactoReloj = e.target.checked; });
  for (const [id, k, u] of [['r-fatiga', 'fatiga', '%'], ['r-taquipnea', 'taquipnea', '%'], ['r-hipoxia', 'hipoxia', 'pts'], ['r-fiebre', 'fiebre', '°C'], ['r-hiper', 'hiper', 'mmHg']]) {
    const el = document.getElementById(id); if (!el) continue;
    el.addEventListener('input', (e) => { S.anom[k] = +e.target.value; document.getElementById(id + '-v').textContent = `${e.target.value} ${u}`; });
    el.addEventListener('change', (e) => { log('a', `Anomalía «${k}» = ${e.target.value} ${u}`); el.blur(); });
  }
  on('s-ventana', async (e) => { S.enlace = await api('/api/enlace', 'PUT', { abierto: e.target.checked }); pintarEnlace(); log('ti', e.target.checked ? 'Ventana con Tierra ABIERTA: sale lo que estaba en cola' : 'Ventana con Tierra CERRADA: todo se guarda en cola'); });
  const ow = document.getElementById('r-owlt');
  if (ow) {
    ow.addEventListener('input', (e) => { document.getElementById('r-owlt-v').textContent = `${e.target.value} s`; });
    ow.addEventListener('change', async (e) => { S.enlace = await api('/api/enlace', 'PUT', { owlt_s: +e.target.value }); pintarEnlace(); ow.blur(); });
  }
  const ba = document.getElementById('b-aviso');
  if (ba) ba.addEventListener('click', async () => {
    const texto = document.getElementById('av-texto').value.trim();
    if (!texto) return;
    await api('/api/tierra/avisos', 'POST', { para: document.getElementById('av-para').value, texto, de: 'Cirujano de vuelo' });
    log('ti', `Tierra envía un aviso: llegará a la nave en ${S.enlace.abierto ? S.enlace.owlt_s + ' s' : 'cuanto se abra la ventana'}`);
    document.getElementById('av-texto').value = ''; document.activeElement.blur();
  });
}

function seleccionar(id) {
  S.sel = id;
  document.querySelectorAll('.disp,.equipo').forEach((g) => g.classList.toggle('sel', g.dataset.id === id));
  if (id === 'cel') $('#cel-badge').setAttribute('r', 0);
  if (id === 'pc') refrescar();
  if (id === 'tierra') api('/api/tierra/bandeja').then((b) => { S.bandeja = b; pintarDetalle(); }).catch(() => {});
  pintarDetalle();
}
