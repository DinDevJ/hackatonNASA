<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVA · Simulador de misión</title>
<style>
:root{
  --bg:#070b14; --panel:#0f1626; --panel2:#141d31; --line:#22304a; --fg:#e7eef9; --dim:#8a9bb8;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; --earth:#38bdf8;
  --dev:#f43f5e; --cuerpo:#dbe4f0;
  --tty:#05070a; --ttyfg:#d6e2d6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b1222,#070b14)}
header h1{font-size:1.05rem;margin:0;letter-spacing:.02em}
header h1 span{color:var(--dim);font-weight:400}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--acc);color:#04111f;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:.85rem}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:.78rem;color:var(--dim);white-space:nowrap}
.pill b{color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:14px;padding:14px 16px}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
#escena{position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#101a30 0,#0b1222 55%,#080d18 100%)}
#escena svg{display:block;width:100%;height:auto}
.limite{display:flex;gap:10px;align-items:flex-start;margin:0 14px 14px;padding:10px 12px;border:1px solid #3a2330;background:rgba(244,63,94,.07);border-radius:10px;font-size:.82rem;color:#e9c9d1}
.limite b{color:#fff}
.limite i{flex:none;width:10px;height:10px;margin-top:5px;border-radius:2px;background:var(--dev)}

/* ── escena ── */
.cuerpo{fill:#111c31;stroke:var(--cuerpo);stroke-width:2.2;stroke-linejoin:round}
.disp,.equipo{cursor:pointer}
.disp .forma{transition:filter .2s,opacity .2s}
.disp:hover .forma,.disp.sel .forma{filter:drop-shadow(0 0 6px rgba(244,63,94,.9))}
.disp:focus,.equipo:focus{outline:none}
.disp:focus-visible .forma{filter:drop-shadow(0 0 6px #60a5fa)}
.disp.apagado .forma{opacity:.25;filter:grayscale(1)}
.disp.sel .lbl{fill:#fff}
.equipo .marco{transition:stroke .2s}
.equipo:hover .marco,.equipo.sel .marco,.equipo:focus-visible .marco{stroke:#93c5fd}
.lbl{fill:var(--fg);font-size:13px;font-weight:650}
.sub{fill:#a9b8d2;font-size:11px}
.lbl,.sub{paint-order:stroke;stroke:#0b1222;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.rojo{fill:#fda4af}
.guia{stroke:#fb7185;stroke-width:1;stroke-dasharray:3 3;opacity:.7;pointer-events:none}
.ondas path{fill:none;stroke:var(--dev);stroke-width:2.2;stroke-linecap:round;animation:pulso 1.5s ease-in-out infinite;pointer-events:none}
.ondas path:nth-child(2){animation-delay:.18s}
.ondas path:nth-child(3){animation-delay:.36s}
.ondas path:nth-child(4){animation-delay:.54s}
.ondas.pc path{stroke:#93c5fd}
.ondas.claro path{stroke:#fff1f2}
.ondas.tierra path{stroke:var(--earth);animation-duration:2.4s}
.ondas.cortado path{stroke:#64748b;animation:none;opacity:.3}
@keyframes pulso{0%,100%{opacity:.12}35%{opacity:1}}
.enl{fill:none;stroke-width:1.5;stroke-dasharray:2 6;stroke:#334766}
.enl.vivo{stroke:#4b6a99;animation:flujo 1.6s linear infinite}
.enl.cortado{stroke:#7f1d1d}
@keyframes flujo{to{stroke-dashoffset:-16}}

/* ── terminal (estilo consola de equipo de red) ── */
#detalle{display:flex;flex-direction:column;height:min(720px,calc(100vh - 110px));min-height:520px;overflow:hidden;background:var(--tty);border-color:#1f2a1f}
@media(max-width:980px){#detalle{height:640px}}
.barra{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#1c2530,#131a22);border-bottom:1px solid #263241}
.barra .luces{display:flex;gap:6px}
.barra .luces i{width:11px;height:11px;border-radius:50%;background:#ef4444}
.barra .luces i:nth-child(2){background:#f59e0b} .barra .luces i:nth-child(3){background:#22c55e}
.barra .titulo{flex:1;text-align:center;font:600 12.5px ui-monospace,Menlo,Consolas,monospace;color:#c9d6e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px}
.tabs button{background:#0d131a;color:#8aa0b5;border:1px solid #263241;border-radius:6px;padding:3px 10px;font:600 12px ui-monospace,Menlo,Consolas,monospace}
.tabs button.on{background:#e7eef9;color:#05070a;border-color:#e7eef9}
.tty{font:12.5px/1.55 ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;color:var(--ttyfg);margin:0}
#tty-estado{padding:10px 12px 8px;border-bottom:1px dashed #1f2a1f;white-space:pre;overflow-x:auto;flex:none}
#tty-log{flex:1;overflow:auto;padding:8px 12px;overflow-wrap:anywhere}
#tty-log>div{padding:1px 0}
#tty-log .ind{padding-left:13ch}
.prompt{padding:6px 12px 10px;border-top:1px solid #121a12;flex:none}
.cursor{display:inline-block;width:.6em;background:#d6e2d6;animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.tty .t{color:#5b6b5b} .tty .pr{color:#7dd3fc} .tty .tx{color:#fbbf24;font-weight:700} .tty .rx{color:#4ade80;font-weight:700}
.tty .hc{color:#3f8f9f} .tty .hx{color:#67e8f9} .tty .dc{color:#f1f5f9} .tty .dim{color:#7b8b7b}
.tty .err{color:#f87171;font-weight:700} .tty .warn{color:#fbbf24} .tty .sys{color:#c4b5fd} .tty .ok{color:#4ade80} .tty .az{color:#38bdf8}
.tty .up{color:#4ade80} .tty .down{color:#f87171}
#config{flex:1;overflow:auto;padding:16px;background:var(--panel);color:var(--fg)}
#config h2{margin:0 0 2px;font-size:1.05rem}
#config h3{margin:14px 0 2px;font-size:.9rem}
#config .rol{color:var(--dim);margin:0 0 12px;font-size:.85rem}

/* ── controles ── */
label.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;font-size:.82rem;color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--dev)}
select,textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}
textarea{resize:vertical;min-height:60px}
.sw{display:flex;align-items:center;gap:10px;margin:10px 0}
.sw input{width:18px;height:18px;accent-color:var(--acc)}
.lista{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:260px;overflow:auto}
.item{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:8px;padding:7px 10px;font-size:.82rem}
.item.rojo{border-left-color:var(--bad)} .item.ambar{border-left-color:var(--warn)} .item.verde{border-left-color:var(--ok)}
.item.aviso{border-left-color:var(--earth)}
.item .t{color:var(--dim);font-size:.72rem}
.banda{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin:4px 0 10px}
.banda .rango{position:absolute;top:3px;bottom:3px;background:rgba(52,211,153,.22);border:1px solid rgba(52,211,153,.6);border-radius:4px}
.banda .esp{position:absolute;top:0;bottom:0;width:2px;background:var(--ok)}
.banda .act{position:absolute;top:-3px;width:10px;height:26px;margin-left:-5px;border-radius:3px;background:var(--fg)}
.banda .act.fuera{background:var(--bad)}
.var-h{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}
.var-h span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.pesos{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:-6px;margin-bottom:12px}
.pesos i{display:block}
.mide{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.mide span{font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#fecdd3}
#log{grid-column:1/-1;padding:10px 14px;max-height:170px;overflow:auto;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
#log .e{color:var(--fg)} #log .a{color:var(--warn)} #log .r{color:var(--bad)} #log .ti{color:var(--earth)}
.nota{font-size:.75rem;color:var(--dim);margin-top:10px}
.cta{margin:14px 0 0;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>EVA · Simulador de misión <span>— LUNNA en vivo</span></h1>
  <div class="ctrl">
    <span class="pill"><span class="dot" id="d-back"></span> backend <b id="v-back">…</b></span>
    <span class="pill">día de misión <b id="v-dia">—</b></span>
    <span class="pill">tramas <b id="v-tramas">0</b></span>
    <button id="b-preparar">Preparar misión · 112 días</button>
    <button id="b-vivo" class="sec" disabled>▶ En vivo</button>
    <button id="b-reiniciar" class="sec">Reiniciar</button>
  </div>
</header>

<script>
'use strict';
// ═══════════ Estado ═══════════
const DIA = 86400000;
const S = {

  encendido: { playera: true, brazalete: true, reloj: true, cel: true },
  bleConectado: true, colaEsp: [], descartadas: 0, enviadasEsp: 0,
  seq: { 401: 0, 201: 0, reloj: 0 },
  anom: { fatiga: 0, taquipnea: 0, fiebre: 0, hipoxia: 0, hiper: 0 },
  contactoReloj: true,
  ultimos: {}, ultimosVar: {}, version: '',
  alertas: [], bandeja: [], avisos: [], enlace: { owlt_s: 20, abierto: true },
  pred: [], sel: 'pc', tab: 'cli',
  consola: { playera: [], brazalete: [], reloj: [], cel: [], pc: [], tierra: [] },
  rx: { playera: 0, brazalete: 0, reloj: 0 }, tx: { cel: 0, tierra: 0 },
};
const BASAL = { fc: 62, spo2: 98, fr: 14, temp: 36.6, sis: 115, dia: 75 };
const DELTA = { fc: -0.08, spo2: -0.005, fr: -0.04, temp: 1.0, sis: -0.06, dia: -0.10 };
const NOMBRE = { '04:A4': 'Frecuencia cardiaca', '04:A3': 'SpO₂', '04:A2': 'Frec. respiratoria', '04:A1': 'Temperatura', '01:V1': 'PA sistólica', 'X:PAD': 'PA diastólica', 'X:PAM': 'PA media' };
const CORTO = { '04:A4': 'fc', '04:A3': 'spo2', '04:A2': 'fr', '04:A1': 'temp', '01:V1': 'pa_sis', 'X:PAD': 'pa_dia', 'X:PAM': 'pa_media' };
const NODO = { playera: 'playera-01', brazalete: 'brazalete-201', reloj: 'reloj-ana', cel: 'smartphone', pc: 'pc-central', tierra: 'tierra-mcc' };
const IFACE = { playera: 'ble0', brazalete: 'ble1', reloj: 'ble2', cel: 'ble3' };
const COLOR = { playera: '#fb7185', brazalete: '#f9a8d4', reloj: '#fcd34d', tierra: '#38bdf8', aviso: '#a7f3d0' };
const POS = { playera: [294, 302], brazalete: [250, 243], reloj: [429, 347], cel: [690, 260], pc: [830, 138] };
const $ = (q) => document.querySelector(q);
const api = async (ruta, metodo = 'GET', cuerpo) => {
  const r = await fetch(ruta, { method: metodo, headers: { 'content-type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const hora = (iso) => new Date(iso).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = (x, n) => String(x).padEnd(n);

// ═══════════ Perfil EVA en el navegador (igual que esquema.ts y trama_eva.h) ═══════════
const ESQ = {
  5: { nombre: 'playera-esp32-v1', campos: [['fc', 'u8', 1], ['fr', 'u8', 1], ['temp', 'i16', 0.01]] },
  2: { nombre: 'brazalete-pa-v1', campos: [['sis', 'u8', 1], ['dia', 'u8', 1]] },
};
const RANGO = { u8: [0, 255], i16: [-32768, 32767] };
function codificar(idDisp, idEsq, seq, tSeg, valores) {
  const campos = ESQ[idEsq].campos;
  const tam = 13 + campos.reduce((s, [, t]) => s + (t === 'u8' ? 1 : 2), 0);
  const b = new Uint8Array(tam), dv = new DataView(b.buffer);
  dv.setUint8(0, 1); dv.setUint32(1, idDisp, true); dv.setUint16(5, idEsq, true);
  dv.setUint16(7, seq & 0xffff, true); dv.setUint32(9, tSeg, true);
  let off = 13;
  campos.forEach(([, t, esc], i) => {
    const [lo, hi] = RANGO[t];
    const crudo = Math.min(hi, Math.max(lo, Math.floor(valores[i] / esc + 0.5)));
    if (t === 'u8') { dv.setUint8(off, crudo); off += 1; } else { dv.setInt16(off, crudo, true); off += 2; }
  });
  return b;
}
// Lo que la central lee de vuelta: así se ve exactamente qué viajó.
function decodificar(b) {
  const dv = new DataView(b.buffer), esq = dv.getUint16(5, true), campos = ESQ[esq].campos;
  const cab = { ver: dv.getUint8(0), disp: dv.getUint32(1, true), esq, seq: dv.getUint16(7, true), t: dv.getUint32(9, true) };
  let off = 13; const v = {};
  for (const [k, t, e] of campos) { if (t === 'u8') { v[k] = dv.getUint8(off); off++; } else { v[k] = +(dv.getInt16(off, true) * e).toFixed(2); off += 2; } }
  return { cab, v };
}
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const hexHtml = (u8) => { const h = [...u8].map((x) => x.toString(16).padStart(2, '0')); return `<span class="hc">${h.slice(0, 13).join(' ')}</span> <span class="hx">${h.slice(13).join(' ')}</span>`; };
const decHtml = ({ cab, v }) => `<span class="dim">ver=${cab.ver} disp=${cab.disp} esq=${cab.esq} seq=${cab.seq} t=${hora(cab.t * 1000)}</span> │ <span class="dc">${Object.entries(v).map(([k, x]) => `${k}=${x}`).join(' ')}</span>`;

// ═══════════ Consolas ═══════════
function marca() { const d = new Date(); return d.toLocaleTimeString('es', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0'); }
function tr(nodo, html) {
  const linea = `<div><span class="t">${marca()}</span> ${html}</div>`;
  const c = S.consola[nodo]; c.push(linea); if (c.length > 400) c.splice(0, c.length - 400);
  if (S.sel === nodo && S.tab === 'cli') {
    const el = $('#tty-log'); if (!el) return;
    const abajo = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    el.insertAdjacentHTML('beforeend', linea);
    while (el.children.length > 400) el.firstChild.remove();
    if (abajo) el.scrollTop = el.scrollHeight;
  }
}
const ind = (html) => `<div class="ind">${html}</div>`;
const syslog = (nodos, nivel, codigo, txt) => nodos.forEach((n) => tr(n, `<span class="${nivel <= 3 ? 'err' : 'sys'}">%${codigo}</span>: ${txt}`));
const updown = (iface, quien, arriba) => `Interface ${iface} (${quien}), changed state to <span class="${arriba ? 'up' : 'down'}">${arriba ? 'up' : 'down'}</span>`;

// Envío de tramas binarias: consola del dispositivo (TX) y de la central (RX).
function trazarBinaria(nodo, tramas) {
  const disp = NODO[nodo], ifc = IFACE[nodo];
  if (tramas.length > 3) {
    tr(nodo, `<span class="tx">TX</span> ${ifc} ▶ pc-central  <span class="warn">ráfaga de ${tramas.length} tramas</span> (vaciando la cola, cada una con su hora original)`);
    tr('pc', `<span class="rx">RX</span> ${ifc} ◀ ${disp}  <span class="warn">ráfaga de ${tramas.length} tramas</span>`);
  }
  for (const u8 of tramas.slice(-Math.min(tramas.length, 2))) {
    const d = decodificar(u8);
    tr(nodo, `<span class="tx">TX</span> ${ifc} ▶ pc-central  BLE NOTIFY ${u8.length} B  seq=${d.cab.seq}` + ind(hexHtml(u8)) + ind(decHtml(d)));
    tr('pc', `<span class="rx">RX</span> ${ifc} ◀ ${disp}  ${u8.length} B  esquema ${d.cab.esq} (${ESQ[d.cab.esq].nombre})` + ind(hexHtml(u8)) + ind(decHtml(d)));
    if (d.cab.esq === 2) tr('pc', `<span class="sys">fórmula</span> pa_media = round((sis + 2·dia) / 3 · 10) / 10 = <span class="dc">${Math.round((d.v.sis + 2 * d.v.dia) / 3 * 10) / 10}</span>`);
  }
}
const trazarRespuesta = (r) => {
  if (r.rechazos?.length) syslog(['pc'], 3, 'EVA-3-RECHAZO', esc(r.rechazos.slice(0, 2).join(' · ')));
  else tr('pc', `<span class="ok">backend ✓</span> ${r.aceptadas} muestras guardadas${r.duplicadas ? ` · ${r.duplicadas} duplicadas ignoradas` : ''} → LUNNA evalúa`);
};

// ═══════════ Fisiología simulada ═══════════
function valor(v, t, conAnomalias) {
  const dia = (t - S.lanzamiento) / DIA, base = BASAL[v];
  const ruido = v === 'spo2' ? 0.006 : 0.035;
  if (dia < 0) return v === 'temp' ? base + 0.15 * gauss() : base * (1 + ruido * gauss());
  let x = v === 'temp' ? base + DELTA.temp + 0.2 * gauss() : base * (1 + DELTA[v] + ruido * gauss());
  if (v === 'fc' && dia < 3) x *= 1 + 0.05 * (1 - dia / 3);
  if (conAnomalias) {
    if (v === 'fc') x *= 1 + S.anom.fatiga / 100;
    if (v === 'fr') x *= 1 + S.anom.taquipnea / 100;
    if (v === 'spo2') x -= S.anom.hipoxia;
    if (v === 'temp') x += S.anom.fiebre;
    if (v === 'sis') x += S.anom.hiper;
    if (v === 'dia') x += S.anom.hiper * 0.6;
  }
  return x;
}
const lecturaPlayera = (t, a) => [valor('fc', t, a), valor('fr', t, a), valor('temp', t, a)];
const lecturaBrazalete = (t, a) => [valor('sis', t, a), valor('dia', t, a)];
function tramaReloj(t, a) {
  const fc = Math.round(valor('fc', t, a)), spo2 = Math.min(100, Math.round(valor('spo2', t, a) * 10) / 10);
  const q = { contacto: S.contactoReloj };
  return { fc, spo2, json: { frame: 'eva.telemetry.v1', source: { id: 'reloj-ana', kind: 'wrist' }, subject: 'ana',
    t_scet: new Date(Math.floor(t / 1000) * 1000).toISOString(), seq: S.seq.reloj++,
    samples: [{ var: '04:A4', value: fc, unit: 'bpm', origin: 'sensor', quality: q },
              { var: '04:A3', value: spo2, unit: '%', origin: 'sensor', quality: q }] } };
}

// ═══════════ Preparar misión: 119 días de historia ═══════════
async function preparar() {
  const b = $('#b-preparar'); b.disabled = true; $('#b-vivo').disabled = true;
  try {
    detener();
    await api('/api/demo/reiniciar', 'POST');
    S.alertas = []; S.bandeja = []; S.avisos = []; S.tramas = 0; S.colaEsp = []; S.seq = { 401: 0, 201: 0, reloj: 0 };
    S.lanzamiento = Date.now() - 112 * DIA;
    const inicioTierra = new Date(S.lanzamiento - 7 * DIA).toISOString();
    await api('/api/fases', 'POST', { desde: inicioTierra, entorno: 'tierra' });
    await api('/api/fases', 'POST', { desde: new Date(S.lanzamiento).toISOString(), entorno: 'orbita' });
    for (const d of [401, 201, 302]) await api('/api/asignaciones', 'POST', { dispositivo: d, tripulante: 'ana', desde: inicioTierra });
    syslog(['pc'], 5, 'EVA-5-ASIGNACION', 'dispositivos 401, 201 y 302 asignados a <span class="dc">ana</span>');
    log('e', 'Misión preparada: lanzamiento hace 112 días. Rellenando historia…');
    tr('pc', '<span class="sys">cargando historia de la misión (119 días, 12 lecturas por día y dispositivo)…</span>');

    let bin = [], json = [];
    const enviar = async () => {
      if (bin.length) { await api('/api/tramas/binaria', 'POST', { b64: bin }); S.tramas += bin.length; bin = []; }
      if (json.length) { await api('/api/tramas', 'POST', json); S.tramas += json.length; json = []; }
      pintarCabecera();
    };
    for (let d = -7; d < 112; d++) {
      for (let k = 0; k < 12; k++) {
        const t = S.lanzamiento + d * DIA + (k + 0.5) * (DIA / 12), ts = Math.floor(t / 1000);
        bin.push(b64(codificar(401, 5, S.seq[401]++, ts, lecturaPlayera(t, false))));
        bin.push(b64(codificar(201, 2, S.seq[201]++, ts, lecturaBrazalete(t, false))));
        json.push(tramaReloj(t, false).json);
      }
      if (bin.length >= 480) { b.textContent = `Rellenando… día ${d}`; await enviar(); }
    }
    await enviar();
    tr('pc', `<span class="ok">historia cargada</span>: ${S.tramas.toLocaleString('es')} tramas · LUNNA calibró a ana con los días 0–13 y congeló la calibración`);
    log('e', `Historia lista: ${S.tramas} tramas de 119 días. LUNNA ya calibró a Ana (días 0–13).`);
    await refrescar();
    $('#b-vivo').disabled = false;
    iniciar();
  } catch (e) { log('r', 'Error al preparar: ' + e.message); }
  b.textContent = 'Preparar misión · 112 días'; b.disabled = false;
}

// ═══════════ En vivo: cada segundo ═══════════
function tick() {
  const t = Date.now(), ts = Math.floor(t / 1000), cada5 = S.tic++ % 5 === 0;

  // Playera: el ESP32 lee sus sensores y encola; sólo vacía la cola si hay Bluetooth.
  if (S.encendido.playera) {
    const v = lecturaPlayera(t, true); S.colaEsp.push({ ts, v }); S.ultimos.playera = v;
    if (!S.bleConectado) tr('playera', `<span class="warn">cola</span> sin enlace: lectura guardada en RAM · ${S.colaEsp.length}/1800`);
  }
  if (S.colaEsp.length > 1800) { S.descartadas += S.colaEsp.length - 1800; S.colaEsp.splice(0, S.colaEsp.length - 1800); }
  if (S.bleConectado && S.colaEsp.length) {
    const tramas = S.colaEsp.splice(0, 40).map((r) => codificar(401, 5, S.seq[401]++, r.ts, r.v));
    S.enviadasEsp += tramas.length; S.rx.playera += tramas.length;
    trazarBinaria('playera', tramas);
    api('/api/tramas/binaria', 'POST', { b64: tramas.map(b64) }).then((r) => { S.tramas += tramas.length; pintarCabecera(); trazarRespuesta(r); }).catch((e) => log('r', e.message));
    paquete(POS.playera, POS.pc, COLOR.playera);
  }

  // Brazalete: mide cada cierto tiempo y manda su propia trama por Bluetooth.
  if (cada5 && S.encendido.brazalete) {
    const v = lecturaBrazalete(t, true), u8 = codificar(201, 2, S.seq[201]++, ts, v);
    S.ultimos.brazalete = v; S.rx.brazalete++;
    trazarBinaria('brazalete', [u8]);
    api('/api/tramas/binaria', 'POST', { b64: [b64(u8)] }).then((r) => { S.tramas++; pintarCabecera(); trazarRespuesta(r); }).catch(() => {});
    paquete(POS.brazalete, POS.pc, COLOR.brazalete);
  }

  // Reloj: FC y SpO₂ cada 5 s, directo a la central, en JSON.
  if (cada5 && S.encendido.reloj) {
    const r = tramaReloj(t, true), txt = JSON.stringify(r.json);
    S.ultimos.reloj = [r.fc, r.spo2]; S.rx.reloj++;
    const resumen = `<span class="dc">fc=${r.fc} spo2=${r.spo2}</span> <span class="dim">contacto=${S.contactoReloj ? 'sí' : 'NO'}</span>`;
    tr('reloj', `<span class="tx">TX</span> ble2 ▶ pc-central  JSON eva.telemetry.v1 ${txt.length} B  seq=${r.json.seq}` + ind(`<span class="hx">${esc(txt.slice(0, 150))}…</span>`) + ind(resumen));
    tr('pc', `<span class="rx">RX</span> ble2 ◀ reloj-ana  JSON ${txt.length} B` + ind(resumen + (S.contactoReloj ? '' : ' <span class="warn">→ se guarda pero LUNNA no la evalúa</span>')));
    api('/api/tramas', 'POST', r.json).then(([res]) => { S.tramas++; pintarCabecera(); trazarRespuesta(res); }).catch(() => {});
    paquete(POS.reloj, POS.pc, COLOR.reloj);
  }
  pintarEstado();
}
function iniciar() { if (S.temporizador) return; S.vivo = true; S.temporizador = setInterval(tick, 1000); pintarCabecera(); log('e', 'En vivo: la playera manda 1 trama por segundo; brazalete y reloj, 1 cada 5 s.'); }
function detener() { clearInterval(S.temporizador); S.temporizador = null; S.vivo = false; pintarCabecera(); }

// ═══════════ Ondas y paquetes (sobres, como en un simulador de redes) ═══════════
const NS = 'http://www.w3.org/2000/svg';
function ondas(id, [cx, cy], [tx, ty], clase = '', radios = [12, 20, 28], abre = 0.5) {
  const g = document.createElementNS(NS, 'g'); g.id = 'o-' + id; g.setAttribute('class', 'ondas ' + clase); g.dataset.clase = clase;
  const a = Math.atan2(ty - cy, tx - cx);
  for (const r of radios) {
    const p = document.createElementNS(NS, 'path');
    const x1 = cx + r * Math.cos(a - abre), y1 = cy + r * Math.sin(a - abre), x2 = cx + r * Math.cos(a + abre), y2 = cy + r * Math.sin(a + abre);
    p.setAttribute('d', `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    g.appendChild(p);
  }
  $('#ondas').appendChild(g);
}
function paquete([x0, y0], [x1, y1], color, dur = 900) {
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = `<rect x="-9" y="-6.5" width="18" height="13" rx="1.5" fill="${color}" stroke="#0b1222" stroke-width="1.2"/><path d="M-9 -6.5 L0 1.5 L9 -6.5" fill="none" stroke="#0b1222" stroke-width="1.3"/>`;
  $('#paquetes').appendChild(g);
  const t0 = performance.now();
  (function paso(ahora) {
    const k = Math.min(1, (ahora - t0) / dur), e = k * k * (3 - 2 * k);
    g.setAttribute('transform', `translate(${(x0 + (x1 - x0) * e).toFixed(1)} ${(y0 + (y1 - y0) * e).toFixed(1)})`);
    g.setAttribute('opacity', k < 0.9 ? 1 : (1 - k) * 10);
    if (k < 1) requestAnimationFrame(paso); else g.remove();
  })(t0);
}

// ═══════════ Eventos del backend ═══════════
function conectarEventos() {
  const es = new EventSource('/api/stream');
  es.addEventListener('muestra', (e) => { const m = JSON.parse(e.data); S.ultimosVar[m.variable] = m.valor; });
  es.addEventListener('alerta', (e) => {
    const a = JSON.parse(e.data); S.alertas.unshift(a);
    const nivel = a.estado === 'rojo' ? 'r' : a.estado === 'ambar' ? 'a' : 'e';
    log(nivel, `LUNNA · ${a.estado.toUpperCase()} · ${NOMBRE[a.variable] || a.variable}: ${a.valor} (esperado ${a.esperado}, z=${a.z}, P(nominal)=${a.prob_nominal})`);
    const cls = a.estado === 'rojo' ? 'err' : a.estado === 'ambar' ? 'warn' : 'ok';
    tr('pc', `<span class="${cls}">%LUNNA-${a.estado === 'rojo' ? 2 : a.estado === 'ambar' ? 4 : 6}-${a.estado.toUpperCase()}</span>: ${a.tripulante} · ${NOMBRE[a.variable] || a.variable} mediana 24 h = <span class="dc">${a.valor}</span>` +
      ind(`esperado ${a.esperado} · banda 95 % [${(a.banda || []).join(' – ')}] · z = ${a.z} · P(nominal) = ${a.prob_nominal}`) +
      (a.estado !== 'verde' ? ind(`<span class="az">DTN</span> alerta encolada para Tierra (prioridad ${a.estado === 'rojo' ? 0 : 1})`) : ''));
    $('#pc-onda').setAttribute('stroke', a.estado === 'rojo' ? '#f87171' : a.estado === 'ambar' ? '#fbbf24' : '#34d399');
    if (S.sel === 'pc' && S.tab === 'config') pintarDetalle();
  });
  es.addEventListener('rechazo', (e) => syslog(['pc'], 3, 'EVA-3-RECHAZO', esc(JSON.parse(e.data).slice(0, 2).join(' · '))));
  es.addEventListener('tierra', (e) => {
    const b = JSON.parse(e.data); S.bandeja.unshift(b); S.tx.tierra++;
    paquete([830, 222], [830, 458], COLOR.tierra, 1600);
    const edad = Math.round((Date.parse(b.t_ert) - Date.parse(b.t_scet)) / 1000);
    const que = b.tipo === 'alerta' ? `ALERTA ${b.datos.estado} · ${b.datos.tripulante} · ${NOMBRE[b.datos.variable] || b.datos.variable} = ${b.datos.valor}` : `RESUMEN · ${b.datos.length} variables`;
    tr('pc', `<span class="tx">TX</span> dtn0 ▶ tierra-mcc  ${que}`);
    tr('tierra', `<span class="rx">RX</span> dtn0 ◀ pc-central  <span class="${b.tipo === 'alerta' ? 'err' : 'dc'}">${que}</span>` + ind(`ocurrió ${hora(b.t_scet)} · llegó ${hora(b.t_ert)} · <span class="warn">${edad} s de antigüedad</span>`));
    if (b.tipo === 'alerta') log('ti', `Tierra recibe alerta de ${b.datos.tripulante} (${b.datos.estado}), ocurrida a las ${hora(b.t_scet)}: llegó con ${edad} s de antigüedad`);
    if (S.sel === 'tierra' && S.tab === 'config') pintarDetalle();
  });
  es.addEventListener('aviso', (e) => {
    const a = JSON.parse(e.data); S.avisos.unshift(a);
    paquete([830, 458], [830, 222], COLOR.tierra, 1600);
    tr('pc', `<span class="rx">RX</span> dtn0 ◀ tierra-mcc  aviso para ${a.para}: <span class="dc">«${esc(a.texto)}»</span>`);
    if (S.encendido.cel) {
      tr('pc', `<span class="tx">TX</span> ble3 ▶ smartphone  aviso (${new Blob([a.texto]).size} B)`);
      tr('cel', `<span class="rx">RX</span> ble3 ◀ pc-central  <span class="az">AVISO de ${esc(a.de)}</span>` + ind(`<span class="dc">«${esc(a.texto)}»</span>`) + ind(`redactado ${hora(a.t_redactado)} · llegó ${hora(a.t_llegada)}`));
      setTimeout(() => { paquete(POS.pc, POS.cel, COLOR.aviso, 700); $('#cel-badge').setAttribute('r', 6); }, 1600);
    } else tr('pc', '<span class="warn">smartphone apagado</span>: el aviso queda en la central');
    log('ti', `Aviso de Tierra para ${a.para}: «${a.texto}» (redactado a las ${hora(a.t_redactado)})`);
    if (['cel', 'tierra'].includes(S.sel) && S.tab === 'config') pintarDetalle();
  });
  es.addEventListener('enlace', (e) => {
    const antes = S.enlace.abierto; S.enlace = JSON.parse(e.data); pintarEnlace();
    if (antes !== S.enlace.abierto) syslog(['pc', 'tierra'], S.enlace.abierto ? 5 : 3, S.enlace.abierto ? 'LINK-5-UPDOWN' : 'LINK-3-UPDOWN', updown('dtn0', 'enlace con Tierra', S.enlace.abierto));
  });
  es.onerror = () => { $('#d-back').className = 'dot bad'; };
  es.onopen = () => { $('#d-back').className = 'dot ok'; };
}

    ${sw('s-ble', 'Conexión Bluetooth con la PC central', S.bleConectado)}
    <div class="nota">Prueba: corta el Bluetooth 20 s y mira la consola: el ESP32 guarda cada lectura. Al reconectar sale una ráfaga y cada trama lleva la hora en que se midió.</div>
    <h3>Provocar una anomalía</h3>
    ${rango('r-fatiga', 'Fatiga: FC por encima de lo normal', S.anom.fatiga, 0, 40, 1, '%')}
    ${rango('r-taquipnea', 'Taquipnea: respiración acelerada', S.anom.taquipnea, 0, 60, 1, '%')}
    ${rango('r-fiebre', 'Fiebre: temperatura más alta', S.anom.fiebre, 0, 3, 0.1, '°C')}
    <div class="nota">LUNNA evalúa la mediana de 24 h: con la anomalía puesta, la alerta tarda unos 20–40 s. Mírala en la consola de la PC central.</div>`,
  brazalete: () => `<h2>Brazalete de presión · opcional</h2>
    <p class="rol">Aparato propio con Bluetooth: va directo a la PC central, no pasa por la playera. La PA media no viaja: la calcula la central con la fórmula del esquema.</p>
    ${mide('manguito inflable → PA sistólica y diastólica')}
    ${sw('s-brazalete', 'Puesto y encendido', S.encendido.brazalete)}
    ${rango('r-hiper', 'Hipertensión: PA por encima de lo normal', S.anom.hiper, 0, 40, 1, 'mmHg')}`,
  reloj: () => `<h2>Reloj inteligente · opcional</h2>
    <p class="rol">Va por Bluetooth directo a la PC central y manda JSON.</p>
    ${mide('PPG → FC', 'PPG rojo/IR → SpO₂')}
    ${sw('s-reloj', 'Puesto y encendido', S.encendido.reloj)}${sw('s-contacto', 'Contacto con la piel', S.contactoReloj)}
    ${rango('r-hipoxia', 'Hipoxia: SpO₂ más baja', S.anom.hipoxia, 0, 10, 0.5, 'pts')}
    <div class="nota">Ojo: un reloj comercial no habla el protocolo EVA. La FC suele salir por el perfil Bluetooth estándar de ritmo cardiaco; la SpO₂ normalmente sólo la da la app del fabricante.</div>`,
  cel: () => `<h2>Smartphone · opcional</h2><p class="rol">No hace falta para medir. Le muestra al astronauta los avisos que llegan de Tierra.</p>
    ${sw('s-cel', 'Encendido', S.encendido.cel)}
    <h3>Avisos recibidos</h3>
    <div class="lista">${S.avisos.length ? S.avisos.map((a) => `<div class="item aviso"><b>${esc(a.de)}</b> → ${esc(a.para)}<br>${esc(a.texto)}<div class="t">redactado ${hora(a.t_redactado)} · llegó ${hora(a.t_llegada)}</div></div>`).join('') : '<div class="nota">Ninguno todavía. Redacta uno desde Tierra.</div>'}</div>`,
  pc: () => {
    const filas = S.pred.map((p) => {
      const act = S.ultimosVar[p.variable];
      const lo = Math.min(p.banda[0], act ?? p.banda[0], p.basal), hi = Math.max(p.banda[1], act ?? p.banda[1], p.basal);
      const m = (hi - lo) * 0.15 || 1, a = lo - m, b = hi + m, x = (v) => ((v - a) / (b - a)) * 100;
      const fuera = act != null && (act < p.banda[0] || act > p.banda[1]);
      const w = p.pesos;
      return `<div class="var-h"><span>${NOMBRE[p.variable] || p.variable}${p.extrapolado ? ' · <em>extrapolado</em>' : ''}</span><span>actual ${act ?? '—'} · esperado ${f1(p.esperado)} [${f1(p.banda[0])}–${f1(p.banda[1])}]</span></div>
        <div class="banda"><div class="rango" style="left:${x(p.banda[0])}%;width:${x(p.banda[1]) - x(p.banda[0])}%"></div><div class="esp" style="left:${x(p.esperado)}%"></div>${act != null ? `<div class="act ${fuera ? 'fuera' : ''}" style="left:${x(act)}%"></div>` : ''}</div>
        <div class="pesos" title="peso de cada fuente"><i style="width:${w.poblacion * 100}%;background:#64748b"></i><i style="width:${w.historial * 100}%;background:#a78bfa"></i><i style="width:${w.vuelo * 100}%;background:#34d399"></i></div>`;
    }).join('');
    return `<h2>LUNNA · lo esperado para Ana</h2><p class="rol">Banda verde: lo normal para ella en este entorno. Marca blanca: lo que mide ahora (roja si se sale).</p>
      ${filas || '<div class="cta">Pulsa <b>Preparar misión</b> para generar 112 días de historia: LUNNA necesita los primeros 14 para conocer a Ana.</div>'}
      <div class="nota">Barra de color: de dónde sale la predicción — <span style="color:#94a3b8">literatura</span> · <span style="color:#a78bfa">misión anterior</span> · <span style="color:#34d399">sus datos en vuelo</span>.</div>
      <h3>Alertas</h3>
      <div class="lista">${S.alertas.length ? S.alertas.map((a) => `<div class="item ${a.estado}"><b>${a.estado.toUpperCase()}</b> · ${NOMBRE[a.variable] || a.variable}: ${a.valor} (esperado ${a.esperado})<div class="t">z = ${a.z} · P(nominal) = ${a.prob_nominal} · ${hora(a.t_scet)}</div></div>`).join('') : '<div class="nota">Sin alertas. Provoca una anomalía en la playera, el brazalete o el reloj.</div>'}</div>`;
  },
  tierra: () => `<h2>Tierra · control de misión</h2><p class="rol">Recibe alertas y resúmenes con el retraso de la luz, y manda avisos a la tripulación.</p>
    ${sw('s-ventana', 'Ventana de comunicación abierta', S.enlace.abierto)}
    ${rango('r-owlt', 'Retraso por trayecto (Marte: 240–1440 s)', S.enlace.owlt_s, 0, 1440, 5, 's')}
    <h3>Mandar un aviso</h3>
    <select id="av-para"><option value="ana">Ana</option><option value="todos">Toda la tripulación</option></select>
    <textarea id="av-texto" style="margin-top:6px" placeholder="p. ej. Vimos tu evento de fatiga. Descansa hoy y repite el check-in mañana."></textarea>
    <button id="b-aviso" style="margin-top:6px">Enviar a la nave</button>
    <h3>Bandeja de entrada</h3>
    <div class="lista">${S.bandeja.length ? S.bandeja.slice(0, 40).map((b) => b.tipo === 'alerta'
      ? `<div class="item ${b.datos.estado}"><b>Alerta ${b.datos.estado}</b> · ${b.datos.tripulante} · ${NOMBRE[b.datos.variable] || b.datos.variable}: ${b.datos.valor}<div class="t">ocurrió ${hora(b.t_scet)} · llegó ${hora(b.t_ert)} · <b>${Math.round((Date.parse(b.t_ert) - Date.parse(b.t_scet)) / 1000)} s de antigüedad</b></div></div>`
      : `<div class="item"><b>Resumen</b> · ${b.datos.length} variables<div class="t">ocurrió ${hora(b.t_scet)} · llegó ${hora(b.t_ert)}</div></div>`).join('') : '<div class="nota">Nada todavía. Cada 30 s llega un resumen, y cada alerta al instante (más el retraso).</div>'}</div>`,
};

function pintarDetalle() {
  const foco = document.activeElement;
  if (S.tab === 'config' && foco && (foco.tagName === 'TEXTAREA' || (foco.tagName === 'INPUT' && foco.type === 'range'))) return; // no interrumpir al usuario
  $('#t-titulo').textContent = `${NODO[S.sel]} — ${S.tab === 'cli' ? 'consola' : S.sel === 'pc' ? 'LUNNA' : 'configuración'}`;
  $('#tab-config').textContent = S.sel === 'pc' ? 'LUNNA' : 'Config';
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
  const c = $('#cuerpo');
  if (S.tab === 'cli') {
    c.innerHTML = `<pre class="tty" id="tty-estado"></pre><div class="tty" id="tty-log">${S.consola[S.sel].join('')}</div>
      <div class="tty prompt"><span class="pr">${NODO[S.sel]}#</span> debug tramas <span class="cursor">&nbsp;</span></div>`;
    pintarEstado();
    const l = $('#tty-log'); l.scrollTop = l.scrollHeight;
  } else {
    c.innerHTML = `<div id="config">${CONFIG[S.sel]()}</div>`;
    conectarControles();
  }
}

function conectarControles() {
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.addEventListener('change', f); };
  const NOM = { playera: 'Playera', brazalete: 'Brazalete', reloj: 'Reloj', cel: 'Smartphone' };
  for (const k of Object.keys(NOM)) on('s-' + k, (e) => {
    S.encendido[k] = e.target.checked; pintarEnlacesLocales();
    syslog([k, 'pc'], e.target.checked ? 5 : 3, e.target.checked ? 'LINK-5-UPDOWN' : 'LINK-3-UPDOWN', updown(IFACE[k], NODO[k], e.target.checked && (k !== 'playera' || S.bleConectado)));
    log('e', `${NOM[k]} ${e.target.checked ? 'encendido' : 'apagado'}`);
  });
  on('s-ble', (e) => {
    S.bleConectado = e.target.checked; pintarEnlacesLocales();
    syslog(['playera', 'pc'], S.bleConectado ? 5 : 3, S.bleConectado ? 'LINK-5-UPDOWN' : 'LINK-3-UPDOWN', updown('ble0', 'playera-01', S.bleConectado));
    if (S.bleConectado) tr('playera', `<span class="sys">sincronizar hora</span>: la PC escribe la hora UTC · se vaciarán ${S.colaEsp.length} lecturas en cola`);
    log(S.bleConectado ? 'e' : 'a', S.bleConectado ? `Bluetooth reconectado: el ESP32 vacía ${S.colaEsp.length} lecturas guardadas` : 'Bluetooth cortado: el ESP32 de la playera empieza a guardar lecturas');
  });
  on('s-contacto', (e) => { S.contactoReloj = e.target.checked; syslog(['reloj'], e.target.checked ? 5 : 4, 'SENSOR-4-CONTACTO', e.target.checked ? 'contacto con la piel recuperado' : 'sin contacto con la piel: las muestras se marcan'); });
  for (const [id, k, u] of [['r-fatiga', 'fatiga', '%'], ['r-taquipnea', 'taquipnea', '%'], ['r-hipoxia', 'hipoxia', 'pts'], ['r-fiebre', 'fiebre', '°C'], ['r-hiper', 'hiper', 'mmHg']]) {
    const el = document.getElementById(id); if (!el) continue;
    el.addEventListener('input', (e) => { S.anom[k] = +e.target.value; document.getElementById(id + '-v').textContent = `${e.target.value} ${u}`; });
    el.addEventListener('change', (e) => { log('a', `Anomalía «${k}» = ${e.target.value} ${u}`); el.blur(); });
  }
  on('s-ventana', async (e) => { S.enlace = await api('/api/enlace', 'PUT', { abierto: e.target.checked }); pintarEnlace(); log('ti', e.target.checked ? 'Ventana con Tierra ABIERTA: sale lo que estaba en cola' : 'Ventana con Tierra CERRADA: todo se guarda en cola'); });
  const ow = document.getElementById('r-owlt');
  if (ow) {
    ow.addEventListener('input', (e) => { document.getElementById('r-owlt-v').textContent = `${e.target.value} s`; });
    ow.addEventListener('change', async (e) => { S.enlace = await api('/api/enlace', 'PUT', { owlt_s: +e.target.value }); pintarEnlace(); ow.blur(); });
  }
  const ba = document.getElementById('b-aviso');
  if (ba) ba.addEventListener('click', async () => {
    const texto = document.getElementById('av-texto').value.trim(), para = document.getElementById('av-para').value;
    if (!texto) return;
    await api('/api/tierra/avisos', 'POST', { para, texto, de: 'Cirujano de vuelo' });
    const cuando = S.enlace.abierto ? `llegará en ${S.enlace.owlt_s} s` : 'en cola hasta que abra la ventana';
    tr('tierra', `<span class="tx">TX</span> dtn0 ▶ pc-central  aviso para ${para}: <span class="dc">«${esc(texto)}»</span>` + ind(`<span class="warn">${cuando}</span>`));
    log('ti', `Tierra envía un aviso: ${cuando}`);
    document.getElementById('av-texto').value = ''; document.activeElement.blur();
  });
}

function seleccionar(id) {
  S.sel = id;
  document.querySelectorAll('.disp,.equipo').forEach((g) => g.classList.toggle('sel', g.dataset.id === id));
  if (id === 'cel') $('#cel-badge').setAttribute('r', 0);
  if (id === 'pc') refrescar();
  if (id === 'tierra') api('/api/tierra/bandeja').then((b) => { S.bandeja = b; if (S.sel === 'tierra') S.tab === 'cli' ? pintarEstado() : pintarDetalle(); }).catch(() => {});
  pintarDetalle();
}

// ═══════════ Arranque ═══════════
ondas('playera', POS.playera, POS.pc, 'claro', [12, 20, 28, 36]);
ondas('brazalete', POS.brazalete, [POS.brazalete[0] + 100, POS.brazalete[1] - 120], '', [10, 17, 24]);
ondas('reloj', POS.reloj, POS.pc);
ondas('cel', [690, 258], POS.pc, '', [10, 17, 24]);
ondas('pc', [830, 218], [830, 520], 'pc', [14, 24, 34], 0.7);
ondas('tierra', [830, 460], [830, 200], 'tierra', [12, 22, 32], 0.6);
document.querySelectorAll('.etq').forEach((g) => {
  const bb = g.getBBox(), r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', bb.x - 6); r.setAttribute('y', bb.y - 4); r.setAttribute('width', bb.width + 12); r.setAttribute('height', bb.height + 8);
  r.setAttribute('fill', 'transparent'); g.insertBefore(r, g.firstChild);
});
document.querySelectorAll('.disp,.equipo').forEach((g) => {
  g.addEventListener('click', () => seleccionar(g.dataset.id));
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); seleccionar(g.dataset.id); } });
});
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { S.tab = b.dataset.tab; pintarDetalle(); }));
$('#b-preparar').addEventListener('click', preparar);
$('#b-vivo').addEventListener('click', () => (S.vivo ? detener() : iniciar()));
$('#b-reiniciar').addEventListener('click', async () => {
  detener(); await api('/api/demo/reiniciar', 'POST');
  S.lanzamiento = null; S.alertas = []; S.bandeja = []; S.avisos = []; S.pred = []; S.tramas = 0;
  for (const k of Object.keys(S.consola)) S.consola[k] = [];
  $('#b-vivo').disabled = true; pintarCabecera(); pintarDetalle(); log('e', 'Misión reiniciada.');
});

(async () => {
  try {
    const s = await api('/api/salud'); S.version = s.version;
    $('#v-back').textContent = 'v' + s.version; $('#d-back').className = 'dot ok';
    S.enlace = await api('/api/enlace'); pintarEnlace();
    const fases = await api('/api/fases');
    const orb = fases.find((f) => f.entorno === 'orbita');
    if (orb) { S.lanzamiento = Date.parse(orb.desde); $('#b-vivo').disabled = false; S.avisos = await api('/api/avisos'); log('e', 'Misión existente recuperada.'); }
  } catch (e) { $('#v-back').textContent = 'sin conexión'; $('#d-back').className = 'dot bad'; }
  // Arranque de cada equipo, como al encender un aparato de red.
  tr('pc', `<span class="sys">EVA central v${S.version || '?'} — LUNNA</span> · pasarela BLE lista · base de datos abierta`);
  for (const k of ['playera', 'brazalete', 'reloj', 'cel']) {
    syslog([k], 5, 'LINK-5-CHANGED', updown(IFACE[k], 'pc-central', true));
    syslog(['pc'], 5, 'LINK-5-CHANGED', updown(IFACE[k], NODO[k], true));
  }
  tr('playera', '<span class="sys">hora recibida</span> de pc-central · esquema publicado: {"id":401,"esquema":5,"campos":["fc:u8","fr:u8","temp:i16*0.01"]}');
  syslog(['pc', 'tierra'], 5, 'LINK-5-CHANGED', updown('dtn0', 'enlace con Tierra', S.enlace.abierto));
  tr('pc', '<span class="dim">pulsa «Preparar misión» y luego haz clic en cualquier equipo para ver su consola</span>');
  conectarEventos(); pintarEnlacesLocales(); pintarEnlace(); pintarCabecera(); seleccionar('pc');
  setInterval(() => { refrescar(); pintarCabecera(); }, 5000);
  log('e', 'Haz clic en cualquier cosa: la playera, el reloj, el brazalete, el celular, la PC central o la Tierra.');
})();
</script>
