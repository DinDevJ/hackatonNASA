<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta de aeronave interactiva para simular sistema LUNNA</title>
<style>
:root{
  --bg:#070b14; --line:#22304a; --fg:#e7eef9; --dim:#8a9bb8;
  --ok:#34d399; --bad:#f87171; --acc:#60a5fa; --earth:#38bdf8;
  --dev:#f43f5e; --cuerpo:#dbe4f0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:fixed;inset:0 0 auto 0;height:52px;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.92);backdrop-filter:blur(6px)}
header h1{font-size:1rem;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;gap:8px;align-items:center;flex:none}
button{background:var(--acc);color:#04111f;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:.82rem}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:.76rem;color:var(--dim);white-space:nowrap}
.pill b{color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
@media(max-width:820px){.pill{display:none} header h1{font-size:.85rem}}

/* ── maqueta a pantalla completa ── */
#escena{position:fixed;inset:52px 0 0 0;background:radial-gradient(ellipse at 35% 45%,#101a30 0,#0b1222 55%,#070b14 100%)}
#escena svg{display:block;width:100%;height:100%}
.pista{position:fixed;left:16px;bottom:14px;z-index:2;max-width:min(560px,calc(100vw - 32px));padding:8px 12px;border:1px solid #3a2330;background:rgba(20,8,14,.75);border-radius:10px;font-size:.8rem;color:#e9c9d1}
.pista b{color:#fff}
.cuerpo{fill:#111c31;stroke:var(--cuerpo);stroke-width:2.2;stroke-linejoin:round}
.disp,.equipo{cursor:pointer}
.disp .forma{transition:filter .2s,opacity .2s}
.disp:hover .forma,.disp.abierto .forma{filter:drop-shadow(0 0 6px rgba(244,63,94,.9))}
.disp:focus,.equipo:focus{outline:none}
.disp:focus-visible .forma{filter:drop-shadow(0 0 6px #60a5fa)}
.disp.apagado .forma{opacity:.25;filter:grayscale(1)}
.equipo .marco{transition:stroke .2s}
.equipo:hover .marco,.equipo.abierto .marco,.equipo:focus-visible .marco{stroke:#93c5fd}
.lbl{fill:var(--fg);font-size:13px;font-weight:650}
.sub{fill:#a9b8d2;font-size:11px}
.lbl,.sub{paint-order:stroke;stroke:#0b1222;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.rojo{fill:#fda4af}
.guia{stroke:#fb7185;stroke-width:1;stroke-dasharray:3 3;opacity:.7;pointer-events:none}
.ondas path{fill:none;stroke:var(--dev);stroke-width:2.2;stroke-linecap:round;animation:pulso 1.5s ease-in-out infinite;pointer-events:none}
.ondas path:nth-child(2){animation-delay:.18s}
.ondas path:nth-child(3){animation-delay:.36s}
.ondas path:nth-child(4){animation-delay:.54s}
.ondas.pc path{stroke:#93c5fd}
.ondas.claro path{stroke:#fff1f2}
.ondas.tierra path{stroke:var(--earth);animation-duration:2.4s}
.ondas.cortado path{stroke:#64748b;animation:none;opacity:.3}
@keyframes pulso{0%,100%{opacity:.12}35%{opacity:1}}
.enl{fill:none;stroke-width:1.5;stroke-dasharray:2 6;stroke:#334766}
.enl.vivo{stroke:#4b6a99;animation:flujo 1.6s linear infinite}
.enl.cortado{stroke:#7f1d1d}
@keyframes flujo{to{stroke-dashoffset:-16}}

/* ── terminales flotantes ── */
.ventana{position:fixed;z-index:10;width:min(560px,calc(100vw - 16px));height:min(340px,calc(100vh - 80px));min-width:300px;min-height:160px;
  display:flex;flex-direction:column;background:#05070a;border:1px solid #2a3442;border-radius:10px;overflow:hidden;resize:both;
  box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03)}
.vbarra{display:flex;align-items:center;gap:10px;padding:7px 10px;background:linear-gradient(#232c38,#161d26);cursor:grab;user-select:none;touch-action:none;flex:none}
.vbarra:active{cursor:grabbing}
.vbarra .luces{display:flex;gap:6px}
.vbarra .luces i{width:12px;height:12px;border-radius:50%;background:#f59e0b}
.vbarra .luces i.cerrar{background:#ef4444;cursor:pointer}
.vbarra .luces i:nth-child(3){background:#22c55e}
.vbarra .vtitulo{flex:1;text-align:center;font:600 12px ui-monospace,Menlo,Consolas,monospace;color:#c9d6e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:52px}
.vlog{flex:1;overflow:auto;padding:8px 12px;font:12.5px/1.6 ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;color:#d6e2d6;overflow-wrap:anywhere}
.vlog .t{color:#6b7b6b} .vlog .hx{color:#67e8f9} .vlog .dim{color:#7b8b7b} .vlog .rojo{color:#f87171} .vlog .amb{color:#fbbf24}
.vlog .verde{color:#4ade80} .vlog .az{color:#38bdf8} .vlog .cmd{color:#fff}
.vcmd{display:flex;gap:8px;align-items:center;padding:6px 12px 8px;border-top:1px solid #141b14;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#7dd3fc;flex:none}
.vcmd input{flex:1;background:transparent;border:0;outline:0;color:#e5f0e5;font:inherit;caret-color:#d6e2d6}
</style>
</head>

<script>
'use strict';
// ═══════════ Estado ═══════════
const DIA = 86400000;
const S = {
  lanzamiento: null, vivo: false, temporizador: null, tic: 0,
  encendido: { playera: true, brazalete: true, reloj: true, cel: true },
  bleConectado: true, colaEsp: [], descartadas: 0,
  seq: { 401: 0, 201: 0, reloj: 0 },
  anom: { fatiga: 0, taquipnea: 0, fiebre: 0, hipoxia: 0, hiper: 0 },
  contactoReloj: true, ultimosVar: {}, version: '',
  enlace: { owlt_s: 20, abierto: true }, pred: [],
  consola: { playera: [], brazalete: [], reloj: [], cel: [], pc: [], tierra: [] },
};
const BASAL = { fc: 62, spo2: 98, fr: 14, temp: 36.6, sis: 115, dia: 75 };
const DELTA = { fc: -0.08, spo2: -0.005, fr: -0.04, temp: 1.0, sis: -0.06, dia: -0.10 };
const NOMBRE = { '04:A4': 'frecuencia cardiaca', '04:A3': 'SpO₂', '04:A2': 'frec. respiratoria', '04:A1': 'temperatura', '01:V1': 'PA sistólica', 'X:PAD': 'PA diastólica', 'X:PAM': 'PA media' };
const CORTO = { '04:A4': 'fc', '04:A3': 'spo2', '04:A2': 'fr', '04:A1': 'temp', '01:V1': 'pa_sis', 'X:PAD': 'pa_dia', 'X:PAM': 'pa_media' };
const NODO = { playera: 'playera-01', brazalete: 'brazalete-201', reloj: 'reloj-ana', cel: 'smartphone', pc: 'pc-central', tierra: 'tierra' };
const COLOR = { playera: '#fb7185', brazalete: '#f9a8d4', reloj: '#fcd34d', tierra: '#38bdf8', aviso: '#a7f3d0' };
const POS = { playera: [294, 302], brazalete: [250, 243], reloj: [429, 347], cel: [690, 260], pc: [830, 138] };
const $ = (q, r = document) => r.querySelector(q);
const api = async (ruta, metodo = 'GET', cuerpo) => {
  const r = await fetch(ruta, { method: metodo, headers: { 'content-type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const hora = (ms) => new Date(ms).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ═══════════ Perfil EVA (igual que esquema.ts y trama_eva.h) ═══════════
const ESQ = {
  5: [['fc', 'u8', 1], ['fr', 'u8', 1], ['temp', 'i16', 0.01]],   // playera
  2: [['sis', 'u8', 1], ['dia', 'u8', 1]],                          // brazalete (pa_media la calcula la central)
};
const RANGO = { u8: [0, 255], i16: [-32768, 32767] };
function codificar(idDisp, idEsq, seq, tSeg, valores) {
  const campos = ESQ[idEsq];
  const b = new Uint8Array(13 + campos.reduce((s, [, t]) => s + (t === 'u8' ? 1 : 2), 0)), dv = new DataView(b.buffer);
  dv.setUint8(0, 1); dv.setUint32(1, idDisp, true); dv.setUint16(5, idEsq, true);
  dv.setUint16(7, seq & 0xffff, true); dv.setUint32(9, tSeg, true);
  let off = 13;
  campos.forEach(([, t, e], i) => {
    const [lo, hi] = RANGO[t];
    const crudo = Math.min(hi, Math.max(lo, Math.floor(valores[i] / e + 0.5)));
    if (t === 'u8') { dv.setUint8(off, crudo); off += 1; } else { dv.setInt16(off, crudo, true); off += 2; }
  });
  return b;
}
function decodificar(b) {
  const dv = new DataView(b.buffer), campos = ESQ[dv.getUint16(5, true)];
  let off = 13; const v = [];
  for (const [k, t, e] of campos) { const x = t === 'u8' ? dv.getUint8(off) : +(dv.getInt16(off, true) * e).toFixed(2); off += t === 'u8' ? 1 : 2; v.push(`${k}=${x}`); }
  return { t: dv.getUint32(9, true) * 1000, txt: v.join(' ') };
}
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const hex = (u8) => [...u8].map((x) => x.toString(16).padStart(2, '0')).join(' ');

// ═══════════ Terminales ═══════════
function tr(nodo, html) {
  const linea = `<div><span class="t">${hora(Date.now())}</span> ${html}</div>`;
  const c = S.consola[nodo]; c.push(linea); if (c.length > 500) c.splice(0, c.length - 500);
  const log = $(`.ventana[data-nodo="${nodo}"] .vlog`); if (!log) return;
  const abajo = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.insertAdjacentHTML('beforeend', linea);
  while (log.children.length > 500) log.firstChild.remove();
  if (abajo) log.scrollTop = log.scrollHeight;
}
function trTrama(nodo, u8, ahora) {
  const d = decodificar(u8), tarde = Math.round((ahora - d.t) / 1000);
  tr(nodo, `enviada trama <span class="hx">${hex(u8)}</span> <span class="dim">${d.txt}${tarde > 1 ? ` · medida a las ${hora(d.t)}` : ''}</span>`);
  tr('pc', `recibida trama de ${NODO[nodo]} <span class="hx">${hex(u8)}</span> <span class="dim">${d.txt}</span>`);
}

let zTop = 10, abiertas = 0;
function abrirTerminal(nodo, ev) {
  let w = $(`.ventana[data-nodo="${nodo}"]`);
  if (w) { w.style.zIndex = ++zTop; $('input', w).focus(); return; }
  w = document.createElement('div');
  w.className = 'ventana'; w.dataset.nodo = nodo; w.style.zIndex = ++zTop;
  w.innerHTML = `<div class="vbarra"><span class="luces"><i class="cerrar" title="Cerrar"></i><i></i><i></i></span><span class="vtitulo">${NODO[nodo]} — terminal</span></div>
    <div class="vlog">${S.consola[nodo].join('')}</div>
    <form class="vcmd"><span>${NODO[nodo]}$</span><input autocomplete="off" spellcheck="false" placeholder="escribe «ayuda»" aria-label="Comando para ${NODO[nodo]}"></form>`;
  document.body.appendChild(w);
  // Junto al equipo que se pulsó, sin salirse de la pantalla.
  const ancho = w.offsetWidth, alto = w.offsetHeight;
  const x0 = (ev?.clientX ?? innerWidth / 2) + 24 + (abiertas % 4) * 18, y0 = (ev?.clientY ?? innerHeight / 2) - 40 + (abiertas % 4) * 18;
  w.style.left = Math.max(8, Math.min(innerWidth - ancho - 8, x0 + ancho > innerWidth ? x0 - ancho - 48 : x0)) + 'px';
  w.style.top = Math.max(60, Math.min(innerHeight - alto - 8, y0)) + 'px';
  abiertas++;
  const log = $('.vlog', w); log.scrollTop = log.scrollHeight;
  w.addEventListener('pointerdown', () => { w.style.zIndex = ++zTop; });
  $('.cerrar', w).addEventListener('click', () => { w.remove(); marcarAbiertos(); });
  arrastrable(w, $('.vbarra', w));
  $('form', w).addEventListener('submit', (e) => { e.preventDefault(); const i = $('input', w); comando(nodo, i.value.trim()); i.value = ''; });
  marcarAbiertos();
  if (nodo === 'cel') $('#cel-badge').setAttribute('r', 0);
}
function arrastrable(w, asa) {
  let dx = 0, dy = 0;
  asa.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('cerrar')) return;
    dx = e.clientX - w.offsetLeft; dy = e.clientY - w.offsetTop; asa.setPointerCapture(e.pointerId);
  });
  asa.addEventListener('pointermove', (e) => {
    if (!asa.hasPointerCapture(e.pointerId)) return;
    w.style.left = Math.max(-w.offsetWidth + 80, Math.min(innerWidth - 80, e.clientX - dx)) + 'px';
    w.style.top = Math.max(52, Math.min(innerHeight - 36, e.clientY - dy)) + 'px';
  });
}
function marcarAbiertos() {
  document.querySelectorAll('.disp,.equipo').forEach((g) => g.classList.toggle('abierto', !!$(`.ventana[data-nodo="${g.dataset.id}"]`)));
}

// ── Comandos: la única forma de tocar algo sin interfaz gráfica ──
const AYUDA = {
  playera: ['apagar | encender', 'ble off | ble on      (cortar o recuperar el Bluetooth)', 'fatiga N              (FC +N %)', 'taquipnea N           (respiración +N %)', 'fiebre N              (temperatura +N °C)'],
  brazalete: ['apagar | encender', 'hipertension N        (presión +N mmHg)'],
  reloj: ['apagar | encender', 'contacto off | contacto on', 'hipoxia N             (SpO₂ −N puntos)'],
  cel: ['apagar | encender'],
  pc: ['lunna                 (lo esperado vs lo medido para Ana)'],
  tierra: ['aviso TEXTO           (manda un aviso a la nave)', 'ventana abrir | ventana cerrar', 'retraso N             (segundos por trayecto)'],
};
async function comando(nodo, txt) {
  if (!txt) return;
  tr(nodo, `<span class="cmd">$ ${esc(txt)}</span>`);
  const [c, ...resto] = txt.split(/\s+/), arg = resto.join(' '), n = Number(resto[0]);
  const ok = (m) => tr(nodo, `<span class="verde">${m}</span>`), mal = (m) => tr(nodo, `<span class="rojo">${m}</span>`);
  const num = (k, uni, max) => { if (!Number.isFinite(n) || n < 0 || n > max) return mal(`uso: ${c} N (0–${max})`); S.anom[k] = n; ok(`${k} = ${n} ${uni}`); };
  if (c === 'ayuda' || c === 'help') return [...AYUDA[nodo], 'limpiar'].forEach((l) => tr(nodo, `<span class="dim">  ${esc(l)}</span>`));
  if (c === 'limpiar' || c === 'clear') { S.consola[nodo] = []; $(`.ventana[data-nodo="${nodo}"] .vlog`).innerHTML = ''; return; }
  if ((c === 'apagar' || c === 'encender') && nodo in S.encendido) {
    S.encendido[nodo] = c === 'encender'; pintarEnlacesLocales(); ok(c === 'encender' ? 'encendido' : 'apagado');
    tr('pc', `<span class="${c === 'encender' ? 'verde' : 'amb'}">${NODO[nodo]} ${c === 'encender' ? 'conectado' : 'desconectado'}</span>`); return;
  }
  if (nodo === 'playera' && c === 'ble' && (arg === 'on' || arg === 'off')) {
    S.bleConectado = arg === 'on'; pintarEnlacesLocales();
    if (S.bleConectado) { ok(`Bluetooth conectado: se envían ${S.colaEsp.length} tramas guardadas`); tr('pc', '<span class="verde">playera-01 reconectada</span>'); }
    else { tr(nodo, '<span class="amb">Bluetooth cortado: las tramas se guardan en cola</span>'); tr('pc', '<span class="amb">playera-01 sin conexión</span>'); }
    return;
  }
  if (nodo === 'playera' && ['fatiga', 'taquipnea', 'fiebre'].includes(c)) return num(c, { fatiga: '%', taquipnea: '%', fiebre: '°C' }[c], { fatiga: 60, taquipnea: 100, fiebre: 4 }[c]);
  if (nodo === 'brazalete' && c === 'hipertension') return num('hiper', 'mmHg', 60);
  if (nodo === 'reloj' && c === 'hipoxia') return num('hipoxia', 'puntos', 15);
  if (nodo === 'reloj' && c === 'contacto' && (arg === 'on' || arg === 'off')) { S.contactoReloj = arg === 'on'; return ok(`contacto con la piel: ${arg === 'on' ? 'sí' : 'no'}`); }
  if (nodo === 'pc' && c === 'lunna') {
    await refrescar();
    if (!S.pred.length) return mal('sin datos: pulsa «Preparar misión»');
    tr(nodo, `<span class="dim">${`${'variable'.padEnd(10)}${'medido'.padEnd(9)}${'esperado'.padEnd(10)}banda 95 %`.replace(/ /g, '&nbsp;')}</span>`);
    for (const p of S.pred) {
      const act = S.ultimosVar[p.variable], fuera = act != null && (act < p.banda[0] || act > p.banda[1]);
      tr(nodo, `${(CORTO[p.variable] || p.variable).padEnd(10)}${String(act ?? '—').padEnd(9)}${p.esperado.toFixed(1).padEnd(10)}${p.banda[0].toFixed(1)}–${p.banda[1].toFixed(1)}`.replace(/ /g, '&nbsp;') + (fuera ? ' <span class="amb">fuera*</span>' : ''));
    }
    return tr(nodo, '<span class="dim">* lectura suelta; LUNNA sólo alerta si se sale la mediana de 24 h</span>');
  }
  if (nodo === 'tierra' && c === 'aviso' && arg) {
    await api('/api/tierra/avisos', 'POST', { para: 'ana', texto: arg, de: 'Cirujano de vuelo' });
    return tr(nodo, `enviado aviso «${esc(arg)}» <span class="dim">${S.enlace.abierto ? `llegará en ${S.enlace.owlt_s} s` : 'en cola hasta que se abra la ventana'}</span>`);
  }
  if (nodo === 'tierra' && c === 'ventana' && (arg === 'abrir' || arg === 'cerrar')) { S.enlace = await api('/api/enlace', 'PUT', { abierto: arg === 'abrir' }); pintarEnlace(); return ok(`ventana ${arg === 'abrir' ? 'abierta' : 'cerrada'}`); }
  if (nodo === 'tierra' && c === 'retraso' && Number.isFinite(n) && n >= 0) { S.enlace = await api('/api/enlace', 'PUT', { owlt_s: n }); pintarEnlace(); return ok(`retraso = ${n} s`); }
  mal(`comando no reconocido: ${esc(c)} · escribe «ayuda»`);
}

// ═══════════ Fisiología simulada ═══════════
function valor(v, t, conAnomalias) {
  const dia = (t - S.lanzamiento) / DIA, base = BASAL[v];
  const ruido = v === 'spo2' ? 0.006 : 0.035;
  if (dia < 0) return v === 'temp' ? base + 0.15 * gauss() : base * (1 + ruido * gauss());
  let x = v === 'temp' ? base + DELTA.temp + 0.2 * gauss() : base * (1 + DELTA[v] + ruido * gauss());
  if (v === 'fc' && dia < 3) x *= 1 + 0.05 * (1 - dia / 3);
  if (conAnomalias) {
    if (v === 'fc') x *= 1 + S.anom.fatiga / 100;
    if (v === 'fr') x *= 1 + S.anom.taquipnea / 100;
    if (v === 'spo2') x -= S.anom.hipoxia;
    if (v === 'temp') x += S.anom.fiebre;
    if (v === 'sis') x += S.anom.hiper;
    if (v === 'dia') x += S.anom.hiper * 0.6;
  }
  return x;
}
const lecturaPlayera = (t, a) => [valor('fc', t, a), valor('fr', t, a), valor('temp', t, a)];
const lecturaBrazalete = (t, a) => [valor('sis', t, a), valor('dia', t, a)];
function tramaReloj(t, a) {
  const fc = Math.round(valor('fc', t, a)), spo2 = Math.min(100, Math.round(valor('spo2', t, a) * 10) / 10);
  const q = { contacto: S.contactoReloj };
  return { frame: 'eva.telemetry.v1', source: { id: 'reloj-ana', kind: 'wrist' }, subject: 'ana',
    t_scet: new Date(Math.floor(t / 1000) * 1000).toISOString(), seq: S.seq.reloj++,
    samples: [{ var: '04:A4', value: fc, unit: 'bpm', origin: 'sensor', quality: q },
              { var: '04:A3', value: spo2, unit: '%', origin: 'sensor', quality: q }] };
}

// ═══════════ Preparar misión: 119 días de historia ═══════════
async function preparar() {
  const b = $('#b-preparar'); b.disabled = true; $('#b-vivo').disabled = true;
  try {
    detener();
    await api('/api/demo/reiniciar', 'POST');
    S.colaEsp = []; S.seq = { 401: 0, 201: 0, reloj: 0 };
    S.lanzamiento = Date.now() - 112 * DIA;
    const inicioTierra = new Date(S.lanzamiento - 7 * DIA).toISOString();
    await api('/api/fases', 'POST', { desde: inicioTierra, entorno: 'tierra' });
    await api('/api/fases', 'POST', { desde: new Date(S.lanzamiento).toISOString(), entorno: 'orbita' });
    for (const d of [401, 201, 302]) await api('/api/asignaciones', 'POST', { dispositivo: d, tripulante: 'ana', desde: inicioTierra });
    tr('pc', 'dispositivos 401, 201 y 302 asignados a ana · cargando 119 días de historia…');
    let bin = [], json = [], total = 0;
    const enviar = async () => {
      if (bin.length) { await api('/api/tramas/binaria', 'POST', { b64: bin }); total += bin.length; bin = []; }
      if (json.length) { await api('/api/tramas', 'POST', json); total += json.length; json = []; }
    };
    for (let d = -7; d < 112; d++) {
      for (let k = 0; k < 12; k++) {
        const t = S.lanzamiento + d * DIA + (k + 0.5) * (DIA / 12), ts = Math.floor(t / 1000);
        bin.push(b64(codificar(401, 5, S.seq[401]++, ts, lecturaPlayera(t, false))));
        bin.push(b64(codificar(201, 2, S.seq[201]++, ts, lecturaBrazalete(t, false))));
        json.push(tramaReloj(t, false));
      }
      if (bin.length >= 480) { b.textContent = `Rellenando… día ${d}`; await enviar(); }
    }
    await enviar();
    tr('pc', `<span class="verde">historia cargada: ${total.toLocaleString('es')} tramas · LUNNA calibró a ana con los días 0–13</span>`);
    $('#v-dia').textContent = 112;
    $('#b-vivo').disabled = false;
    iniciar();
  } catch (e) { tr('pc', `<span class="rojo">error al preparar: ${esc(e.message)}</span>`); }
  b.textContent = 'Preparar misión'; b.disabled = false;
}

// ═══════════ En vivo: cada segundo ═══════════
function tick() {
  const t = Date.now(), ts = Math.floor(t / 1000), cada5 = S.tic++ % 5 === 0;
  // Playera: el ESP32 lee y encola; sólo vacía la cola con Bluetooth.
  if (S.encendido.playera) {
    S.colaEsp.push({ ts, v: lecturaPlayera(t, true) });
    if (!S.bleConectado) tr('playera', `<span class="amb">sin conexión: trama guardada en cola (${S.colaEsp.length})</span>`);
  }
  if (S.colaEsp.length > 1800) { S.descartadas += S.colaEsp.length - 1800; S.colaEsp.splice(0, S.colaEsp.length - 1800); }
  if (S.bleConectado && S.colaEsp.length) {
    const tramas = S.colaEsp.splice(0, 40).map((r) => codificar(401, 5, S.seq[401]++, r.ts, r.v));
    tramas.forEach((u8) => trTrama('playera', u8, t));
    api('/api/tramas/binaria', 'POST', { b64: tramas.map(b64) }).catch((e) => tr('pc', `<span class="rojo">${esc(e.message)}</span>`));
    paquete(POS.playera, POS.pc, COLOR.playera);
  }
  // Brazalete: su propia trama, directo a la central.
  if (cada5 && S.encendido.brazalete) {
    const u8 = codificar(201, 2, S.seq[201]++, ts, lecturaBrazalete(t, true));
    trTrama('brazalete', u8, t);
    api('/api/tramas/binaria', 'POST', { b64: [b64(u8)] }).catch(() => {});
    paquete(POS.brazalete, POS.pc, COLOR.brazalete);
  }
  // Reloj: JSON, directo a la central.
  if (cada5 && S.encendido.reloj) {
    const j = tramaReloj(t, true), txt = JSON.stringify(j);
    tr('reloj', `enviada trama <span class="hx">${esc(txt)}</span>`);
    tr('pc', `recibida trama de reloj-ana <span class="hx">${esc(txt)}</span>${S.contactoReloj ? '' : ' <span class="amb">(sin contacto: se guarda, no se evalúa)</span>'}`);
    api('/api/tramas', 'POST', j).catch(() => {});
    paquete(POS.reloj, POS.pc, COLOR.reloj);
  }
}
function iniciar() { if (S.temporizador) return; S.vivo = true; S.temporizador = setInterval(tick, 1000); $('#b-vivo').textContent = '⏸ Pausar'; }
function detener() { clearInterval(S.temporizador); S.temporizador = null; S.vivo = false; $('#b-vivo').textContent = '▶ En vivo'; }

// ═══════════ Ondas y paquetes ═══════════
const NS = 'http://www.w3.org/2000/svg';
function ondas(id, [cx, cy], [tx, ty], clase = '', radios = [12, 20, 28], abre = 0.5) {
  const g = document.createElementNS(NS, 'g'); g.id = 'o-' + id; g.setAttribute('class', 'ondas ' + clase); g.dataset.clase = clase;
  const a = Math.atan2(ty - cy, tx - cx);
  for (const r of radios) {
    const p = document.createElementNS(NS, 'path');
    const x1 = cx + r * Math.cos(a - abre), y1 = cy + r * Math.sin(a - abre), x2 = cx + r * Math.cos(a + abre), y2 = cy + r * Math.sin(a + abre);
    p.setAttribute('d', `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    g.appendChild(p);
  }
  $('#ondas').appendChild(g);
}
function paquete([x0, y0], [x1, y1], color, dur = 900) {
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = `<rect x="-9" y="-6.5" width="18" height="13" rx="1.5" fill="${color}" stroke="#0b1222" stroke-width="1.2"/><path d="M-9 -6.5 L0 1.5 L9 -6.5" fill="none" stroke="#0b1222" stroke-width="1.3"/>`;
  $('#paquetes').appendChild(g);
  const t0 = performance.now();
  (function paso(ahora) {
    const k = Math.min(1, (ahora - t0) / dur), e = k * k * (3 - 2 * k);
    g.setAttribute('transform', `translate(${(x0 + (x1 - x0) * e).toFixed(1)} ${(y0 + (y1 - y0) * e).toFixed(1)})`);
    g.setAttribute('opacity', k < 0.9 ? 1 : (1 - k) * 10);
    if (k < 1) requestAnimationFrame(paso); else g.remove();
  })(t0);
}

// ═══════════ Eventos del backend ═══════════
function conectarEventos() {
  const es = new EventSource('/api/stream');
  es.addEventListener('muestra', (e) => { const m = JSON.parse(e.data); S.ultimosVar[m.variable] = m.valor; });
  es.addEventListener('alerta', (e) => {
    const a = JSON.parse(e.data), cls = a.estado === 'rojo' ? 'rojo' : a.estado === 'ambar' ? 'amb' : 'verde';
    tr('pc', `<span class="${cls}">alerta LUNNA ${a.estado.toUpperCase()}: ${a.tripulante} · ${NOMBRE[a.variable] || a.variable} ${a.valor} (esperado ${a.esperado}, z=${a.z}, P(normal)=${a.prob_nominal})</span>`);
    $('#pc-onda').setAttribute('stroke', a.estado === 'rojo' ? '#f87171' : a.estado === 'ambar' ? '#fbbf24' : '#34d399');
  });
  es.addEventListener('rechazo', (e) => tr('pc', `<span class="rojo">trama rechazada: ${esc(JSON.parse(e.data).slice(0, 2).join(' · '))}</span>`));
  es.addEventListener('tierra', (e) => {
    const b = JSON.parse(e.data), edad = Math.round((Date.parse(b.t_ert) - Date.parse(b.t_scet)) / 1000);
    const que = b.tipo === 'alerta' ? `alerta ${b.datos.estado} de ${b.datos.tripulante}: ${NOMBRE[b.datos.variable] || b.datos.variable} ${b.datos.valor}` : `resumen de ${b.datos.length} variables`;
    paquete([830, 222], [830, 458], COLOR.tierra, 1600);
    tr('pc', `enviado a Tierra: ${que}`);
    tr('tierra', `recibido${b.tipo === 'alerta' ? '' : ''} <span class="${b.tipo === 'alerta' ? 'rojo' : 'az'}">${que}</span> <span class="dim">· ocurrió a las ${hora(Date.parse(b.t_scet))}, llegó con ${edad} s de retraso</span>`);
  });
  es.addEventListener('aviso', (e) => {
    const a = JSON.parse(e.data);
    paquete([830, 458], [830, 222], COLOR.tierra, 1600);
    tr('pc', `recibido aviso de Tierra para ${a.para}: «${esc(a.texto)}»`);
    if (S.encendido.cel) {
      tr('pc', 'enviado aviso al smartphone');
      tr('cel', `recibido aviso de ${esc(a.de)}: <span class="az">«${esc(a.texto)}»</span> <span class="dim">· redactado a las ${hora(Date.parse(a.t_redactado))}</span>`);
      setTimeout(() => { paquete(POS.pc, POS.cel, COLOR.aviso, 700); if (!$('.ventana[data-nodo="cel"]')) $('#cel-badge').setAttribute('r', 6); }, 1600);
    }
  });
  es.addEventListener('enlace', (e) => {
    const antes = S.enlace.abierto; S.enlace = JSON.parse(e.data); pintarEnlace();
    if (antes !== S.enlace.abierto) ['pc', 'tierra'].forEach((n) => tr(n, `<span class="${S.enlace.abierto ? 'verde' : 'amb'}">ventana con Tierra ${S.enlace.abierto ? 'abierta' : 'cerrada: todo se guarda en cola'}</span>`));
  });
  es.onerror = () => { $('#d-back').className = 'dot bad'; };
  es.onopen = () => { $('#d-back').className = 'dot ok'; };
}
async function refrescar() { try { S.pred = await api('/api/prediccion/ana'); } catch {} }

// ═══════════ Pintado de la maqueta ═══════════
function pintarEnlace() {
  const e = S.enlace;
  $('#t-owlt').textContent = e.abierto ? `retraso ${e.owlt_s} s` : 'ventana CERRADA';
  $('#o-tierra')?.setAttribute('class', 'ondas tierra ' + (e.abierto ? '' : 'cortado'));
  $('#c-tierra').setAttribute('class', 'enl ' + (e.abierto ? 'vivo' : 'cortado'));
}
function pintarEnlacesLocales() {
  const a = { playera: S.encendido.playera && S.bleConectado, brazalete: S.encendido.brazalete, reloj: S.encendido.reloj, cel: S.encendido.cel };
  for (const k of Object.keys(a)) { const g = $('#o-' + k); if (g) g.setAttribute('class', `ondas ${g.dataset.clase} ${a[k] ? '' : 'cortado'}`); }
  $('#c-cel').setAttribute('class', 'enl ' + (S.encendido.cel ? 'vivo' : 'cortado'));
  for (const k of ['playera', 'brazalete', 'reloj']) document.querySelectorAll(`.disp[data-id="${k}"]`).forEach((g) => g.classList.toggle('apagado', !S.encendido[k]));
  $('#pc-con').textContent = `${Object.values(a).filter(Boolean).length} conectados`;
}

// ═══════════ Arranque ═══════════
ondas('playera', POS.playera, POS.pc, 'claro', [12, 20, 28, 36]);
ondas('brazalete', POS.brazalete, [POS.brazalete[0] + 100, POS.brazalete[1] - 120], '', [10, 17, 24]);
ondas('reloj', POS.reloj, POS.pc);
ondas('cel', [690, 258], POS.pc, '', [10, 17, 24]);
ondas('pc', [830, 218], [830, 520], 'pc', [14, 24, 34], 0.7);
ondas('tierra', [830, 460], [830, 200], 'tierra', [12, 22, 32], 0.6);
document.querySelectorAll('.etq').forEach((g) => {
  const bb = g.getBBox(), r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', bb.x - 6); r.setAttribute('y', bb.y - 4); r.setAttribute('width', bb.width + 12); r.setAttribute('height', bb.height + 8);
  r.setAttribute('fill', 'transparent'); g.insertBefore(r, g.firstChild);
});
document.querySelectorAll('.disp,.equipo').forEach((g) => {
  g.addEventListener('click', (e) => abrirTerminal(g.dataset.id, e));
  g.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); const r = g.getBoundingClientRect();
    abrirTerminal(g.dataset.id, { clientX: r.right, clientY: r.top + r.height / 2 });
  });
});
$('#b-preparar').addEventListener('click', preparar);
$('#b-vivo').addEventListener('click', () => (S.vivo ? detener() : iniciar()));
$('#b-reiniciar').addEventListener('click', async () => {
  detener(); await api('/api/demo/reiniciar', 'POST');
  S.lanzamiento = null; S.pred = [];
  for (const k of Object.keys(S.consola)) S.consola[k] = [];
  document.querySelectorAll('.vlog').forEach((l) => { l.innerHTML = ''; });
  $('#b-vivo').disabled = true; $('#v-dia').textContent = '—';
  tr('pc', 'misión reiniciada');
});

(async () => {
  try {
    const s = await api('/api/salud'); S.version = s.version;
    $('#v-back').textContent = 'v' + s.version; $('#d-back').className = 'dot ok';
    S.enlace = await api('/api/enlace'); pintarEnlace();
    const orb = (await api('/api/fases')).find((f) => f.entorno === 'orbita');
    if (orb) { S.lanzamiento = Date.parse(orb.desde); $('#b-vivo').disabled = false; $('#v-dia').textContent = Math.floor((Date.now() - S.lanzamiento) / DIA); }
  } catch { $('#v-back').textContent = 'sin conexión'; $('#d-back').className = 'dot bad'; }
  tr('pc', `backend v${S.version || '?'} corriendo · esperando tramas`);
  tr('playera', 'hora recibida de pc-central · lista para enviar');
  tr('tierra', 'control de misión en línea · escribe «ayuda»');
  conectarEventos(); pintarEnlacesLocales(); pintarEnlace();
})();
</script>
