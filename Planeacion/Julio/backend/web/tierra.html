<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUNNA · Control de misión</title>
<style>
:root{
  --bg:#0a0d12; --panel:#10151c; --panel2:#151b24; --line:#1f2733; --fg:#e5e7eb; --dim:#8b95a5; --dim2:#5d6878;
  --acc:#38bdf8; --rojo:#ef4444; --ambar:#f59e0b; --verde:#22c55e;
  --mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:#0c1017}
header h1{margin:0;font-size:1.05rem}
header h1 small{display:block;font-size:.75rem;font-weight:400;color:var(--dim)}
.estado{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;font:12px var(--mono);color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.dot.verde{background:var(--verde)} .dot.ambar{background:var(--ambar)} .dot.rojo{background:var(--rojo)}
main{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:14px;padding:14px 18px;height:calc(100% - 62px)}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.panel h2{margin:0;padding:12px 14px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.cuerpo{padding:12px 14px;overflow:auto;min-height:0;flex:1}

/* tripulación */
.trip{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin:0 0 4px;border:1px solid transparent;border-radius:8px;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.trip:hover{background:var(--panel2)}
.trip.sel{background:var(--panel2);border-color:#2b3646}
.trip span{display:flex;flex-direction:column;line-height:1.25}
.trip small{color:var(--dim);font-size:.75rem}
.nota{font-size:.75rem;color:var(--dim2);margin:12px 0 0}

/* pestañas */
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:600 13px/1 inherit;padding:9px 12px 10px;cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
.tabs button .n{margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--panel2);font:11px var(--mono);color:var(--dim)}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--dim)}
select,textarea,input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
button.sec{background:none;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer}
button.sec:hover{border-color:#334155}

table{width:100%;border-collapse:collapse;font-size:.84rem}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #161d27;vertical-align:top}
td.num{font:13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.hex{font:12px var(--mono);color:#7dd3fc;overflow-wrap:anywhere}
td.dec{font:12px var(--mono);color:var(--dim)}
tr.grupo td{background:#0d1218;color:var(--dim);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font:600 11px var(--mono);white-space:nowrap}
.tag.ok{background:rgba(34,197,94,.12);color:#4ade80} .tag.fuera{background:rgba(245,158,11,.14);color:#fbbf24}
.tag.rojo{background:rgba(239,68,68,.15);color:#f87171} .tag.ambar{background:rgba(245,158,11,.14);color:#fbbf24}
.tag.gris{background:var(--panel2);color:var(--dim)}
.vacio{padding:28px 14px;text-align:center;color:var(--dim)}
button.marcar{background:none;border:1px solid #3a2a2a;color:#fca5a5;border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer;white-space:nowrap}
button.marcar:hover{background:rgba(239,68,68,.12)}

/* alertas */
.alerta{border:1px solid var(--line);border-left:3px solid var(--dim2);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--panel2)}
.alerta.rojo{border-left-color:var(--rojo)} .alerta.ambar{border-left-color:var(--ambar)}
.alerta .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.alerta .meta{font:12px var(--mono);color:var(--dim);margin-top:4px}

/* formulario */
form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.78rem;color:var(--dim)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;padding:7px;border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:.85rem;cursor:pointer}
.seg input:focus-visible+label{outline:2px solid var(--acc)}
.seg input[value=ambar]:checked+label{border-color:var(--ambar);background:rgba(245,158,11,.12)}
.seg input[value=rojo]:checked+label{border-color:var(--rojo);background:rgba(239,68,68,.12)}
textarea{min-height:80px;resize:vertical}
button.enviar{background:var(--rojo);color:#fff;border:0;border-radius:6px;padding:9px;font-weight:700;cursor:pointer}
button.enviar:disabled{opacity:.5;cursor:not-allowed}
.eta{font:12px var(--mono);color:var(--dim)}
.enviado{border-top:1px solid var(--line);padding:10px 0}
.pasos{display:grid;gap:2px;margin-top:6px;font:12px var(--mono);color:var(--dim2)}
.pasos .hecho{color:var(--fg)} .pasos .hecho::before{content:"✓ ";color:var(--verde)}
.pasos .pend::before{content:"… "}
</style>
</head>
<body>
<header>
  <h1>LUNNA · Control de misión<small>Consola del cirujano de vuelo · Tierra</small></h1>
  <div class="estado">
    <span class="chip"><span class="dot" id="d-enlace"></span>enlace <b id="v-enlace">—</b></span>
    <span class="chip">retraso <b id="v-owlt">—</b></span>
    <span class="chip">último contacto <b id="v-contacto">—</b></span>
    <span class="chip">antigüedad de los datos <b id="v-edad">—</b></span>
  </div>
</header>

<main>
  <section class="panel" aria-label="Tripulación">
    <h2>Tripulación</h2>
    <div class="cuerpo" id="lista-trip"></div>
  </section>

  <section class="panel" aria-label="Datos de a bordo">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="procesados" class="on">Procesados<span class="n" id="n-procesados">0</span></button>
      <button role="tab" data-tab="crudos">Crudos<span class="n" id="n-crudos">0</span></button>
      <button role="tab" data-tab="alertas">Alertas de LUNNA<span class="n" id="n-alertas">0</span></button>
    </div>
    <div class="barra" id="barra"></div>
    <div class="cuerpo" id="vista" style="padding:0"></div>
  </section>

  <section class="panel" aria-label="Enviar alerta manual">
    <h2>Alerta manual a la nave</h2>
    <div class="cuerpo">
      <form id="form">
        <label>Tripulante<select id="f-para"></select></label>
        <div><div style="font-size:.78rem;color:var(--dim);margin-bottom:4px">Nivel</div>
          <div class="seg">
            <input type="radio" name="nivel" id="n-ambar" value="ambar" checked><label for="n-ambar">Ámbar · vigilar</label>
            <input type="radio" name="nivel" id="n-rojo" value="rojo"><label for="n-rojo">Rojo · actuar ya</label>
          </div>
        </div>
        <label>Variable<select id="f-var"></select></label>
        <label>Mensaje para la tripulación<textarea id="f-texto" maxlength="500" placeholder="Qué vieron y qué deben hacer. Ej.: FC elevada sostenida desde las 04:20. Suspende el ejercicio y repite la medición en 15 min."></textarea></label>
        <button class="enviar" id="f-enviar" type="submit">Enviar alerta a la nave</button>
        <div class="eta" id="f-eta"></div>
      </form>
      <div style="margin-top:16px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)">Enviadas</div>
      <div id="enviados"></div>
    </div>
  </section>
</main>

<script>
'use strict';
// Regla: todo lo que esta consola muestra llegó por el enlace (bajada), con su
// retraso. Nada se lee directo de la base de datos de la nave.
const $ = (q) => document.querySelector(q);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hora = (iso) => (iso ? new Date(iso).toLocaleTimeString('es', { hour12: false }) : '—');
const api = async (ruta, metodo = 'GET', cuerpo) => {
  const r = await fetch(ruta, { method: metodo, headers: { 'content-type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const T = {
  enlace: { owlt_s: 20, abierto: true }, vars: {}, trips: [], disps: {},
  procesados: {},          // tripulante → variable → fila del último resumen
  crudos: [],              // tramas tal como llegaron
  alertas: [],             // alertas automáticas de LUNNA
  estadoVar: {},           // "trip|var" → último estado de LUNNA
  acuses: {},              // id de subida → acuse
  enviados: [], sel: 'todos', tab: 'procesados', pausa: false, filtroDisp: '',
  ultimoContacto: null, ultimaEdad: null,
};
const nombreVar = (id) => T.vars[id]?.nombre ?? id;
const unidad = (id) => T.vars[id]?.unidad ?? '';
const nombreTrip = (id) => T.trips.find((t) => t.id === id)?.nombre ?? id;
const f = (x, d = 1) => (x == null || Number.isNaN(+x) ? '—' : (+x).toFixed(d));

// ═══ llegada de un paquete de la nave ═══
function recibir(b, pintar = true) {
  T.ultimoContacto = b.t_ert;
  T.ultimaEdad = Math.round((Date.parse(b.t_ert) - Date.parse(b.t_scet)) / 1000);
  if (b.tipo === 'resumen') {
    for (const r of b.datos) (T.procesados[r.tripulante] ??= {})[r.variable] = { ...r, t_ert: b.t_ert };
  } else if (b.tipo === 'crudos') {
    for (const tr of b.datos) T.crudos.push({ ...tr, t_ert: b.t_ert });
    if (T.crudos.length > 2000) T.crudos.splice(0, T.crudos.length - 2000);
  } else if (b.tipo === 'alerta') {
    T.alertas.unshift({ ...b.datos, t_ert: b.t_ert });
    T.estadoVar[`${b.datos.tripulante}|${b.datos.variable}`] = b.datos.estado;
  } else if (b.tipo === 'acuse') {
    T.acuses[b.datos.id] = { ...b.datos, t_ert: b.t_ert };
  }
  if (pintar) pintarTodo();
}

// ═══ pintado ═══
function pintarCabecera() {
  const e = T.enlace;
  $('#d-enlace').className = 'dot ' + (e.abierto ? 'verde' : 'rojo');
  $('#v-enlace').textContent = e.abierto ? 'ABIERTO' : 'CERRADO';
  $('#v-owlt').textContent = `${e.owlt_s} s`;
  const hace = T.ultimoContacto ? Math.max(0, Math.round((Date.now() - Date.parse(T.ultimoContacto)) / 1000)) : null;
  $('#v-contacto').textContent = hace == null ? 'sin datos' : `${hora(T.ultimoContacto)} (hace ${hace} s)`;
  $('#v-edad').textContent = T.ultimaEdad == null ? '—' : `${T.ultimaEdad} s`;
  const pend = T.enviados.filter((a) => !T.acuses[a.id]).length;
  $('#f-eta').textContent = e.abierto
    ? `Llega a bordo en ~${e.owlt_s} s · confirmación de recepción en ~${2 * e.owlt_s} s${pend ? ` · ${pend} sin confirmar` : ''}`
    : 'Ventana CERRADA: la alerta queda en cola hasta que se abra.';
}
function estadoTrip(id) {
  const est = Object.entries(T.estadoVar).filter(([k]) => k.startsWith(id + '|')).map(([, v]) => v);
  if (est.includes('rojo')) return 'rojo';
  if (est.includes('ambar')) return 'ambar';
  return T.procesados[id] ? 'verde' : '';
}
function pintarTrip() {
  const filas = [{ id: 'todos', nombre: 'Toda la tripulación', rol: `${T.trips.length} tripulantes` }, ...T.trips];
  $('#lista-trip').innerHTML = filas.map((t) => `<button class="trip ${T.sel === t.id ? 'sel' : ''}" data-id="${esc(t.id)}">
      <span class="dot ${t.id === 'todos' ? '' : estadoTrip(t.id)}"></span><span>${esc(t.nombre)}<small>${esc(t.rol ?? '')}</small></span></button>`).join('')
    + '<p class="nota">Punto de color: último estado que LUNNA reportó para alguna de sus variables.</p>';
  document.querySelectorAll('.trip').forEach((b) => b.addEventListener('click', () => { T.sel = b.dataset.id; pintarTodo(); }));
}
const visibles = () => (T.sel === 'todos' ? T.trips.map((t) => t.id) : [T.sel]);

function vistaProcesados() {
  $('#barra').innerHTML = '<span>Último valor recibido de cada variable y lo que LUNNA espera para esa persona en su entorno actual. Llega un resumen cada 30 s.</span>';
  let html = '';
  for (const id of visibles()) {
    const vars = T.procesados[id]; if (!vars) continue;
    if (T.sel === 'todos') html += `<tr class="grupo"><td colspan="8">${esc(nombreTrip(id))}</td></tr>`;
    for (const r of Object.values(vars).sort((a, b) => a.variable.localeCompare(b.variable))) {
      const fuera = r.banda && r.valor != null && (r.valor < r.banda[0] || r.valor > r.banda[1]);
      const lunna = T.estadoVar[`${id}|${r.variable}`];
      const etiqueta = lunna === 'rojo' || lunna === 'ambar' ? `<span class="tag ${lunna}">LUNNA ${lunna}</span>`
        : !r.banda ? '<span class="tag gris">sin modelo</span>' : fuera ? '<span class="tag fuera">fuera de banda</span>' : '<span class="tag ok">dentro</span>';
      html += `<tr><td>${esc(nombreVar(r.variable))}${r.calibrando ? ' <span class="tag gris">calibrando</span>' : ''}${r.extrapolado ? ' <span class="tag gris">extrapolado</span>' : ''}</td>
        <td class="num">${f(r.valor)} <span style="color:var(--dim)">${esc(unidad(r.variable))}</span></td>
        <td class="num">${f(r.esperado)}</td><td class="num">${r.banda ? `${f(r.banda[0])} – ${f(r.banda[1])}` : '—'}</td>
        <td>${etiqueta}</td><td class="num">${hora(r.t_scet)}</td><td class="num">${hora(r.t_ert)}</td>
        <td><button class="marcar" data-trip="${esc(id)}" data-var="${esc(r.variable)}" data-val="${esc(f(r.valor))}">Marcar anomalía</button></td></tr>`;
    }
  }
  $('#vista').innerHTML = html
    ? `<table><thead><tr><th>Variable</th><th>Último valor</th><th>Esperado</th><th>Banda 95 %</th><th>Estado</th><th>Medido a bordo</th><th>Recibido</th><th></th></tr></thead><tbody>${html}</tbody></table>
       <p class="nota" style="padding:0 14px 12px">«Fuera de banda» es una lectura suelta. LUNNA sólo alerta cuando se sale la mediana de 24 h.</p>`
    : '<div class="vacio">Aún no llega ningún resumen de la nave.</div>';
  document.querySelectorAll('button.marcar').forEach((b) => b.addEventListener('click', () =>
    prellenar(b.dataset.trip, b.dataset.var, `${nombreVar(b.dataset.var)} en ${b.dataset.val} ${unidad(b.dataset.var)}: `)));
}

function vistaCrudos() {
  const disps = [...new Set(T.crudos.map((c) => c.dispositivo))];
  $('#barra').innerHTML = `<span>Tramas exactamente como las mandó cada dispositivo. Bajan en paquetes cada 30 s, con la prioridad más baja.</span>
    <span style="display:flex;gap:8px"><select id="f-disp" aria-label="Filtrar por dispositivo"><option value="">Todos los dispositivos</option>${disps.map((d) => `<option value="${d}" ${String(d) === T.filtroDisp ? 'selected' : ''}>${esc(T.disps[d]?.clave ?? d)} (${d})</option>`).join('')}</select>
    <button class="sec" id="b-pausa">${T.pausa ? 'Reanudar' : 'Pausar'}</button></span>`;
  $('#f-disp').addEventListener('change', (e) => { T.filtroDisp = e.target.value; pintarVista(); });
  $('#b-pausa').addEventListener('click', () => { T.pausa = !T.pausa; pintarVista(true); });
  const vis = new Set(visibles());
  const filas = T.crudos.filter((c) => vis.has(c.tripulante) && (!T.filtroDisp || String(c.dispositivo) === T.filtroDisp)).slice(-400).reverse();
  $('#vista').innerHTML = filas.length
    ? `<table><thead><tr><th>Medido a bordo</th><th>Recibido</th><th>Dispositivo</th><th>Tripulante</th><th>seq</th><th>Trama</th><th>Decodificado</th></tr></thead><tbody>${filas.map((c) => `<tr>
        <td class="num">${hora(c.t_scet)}</td><td class="num">${hora(c.t_ert)}</td><td>${esc(T.disps[c.dispositivo]?.clave ?? c.dispositivo)}</td>
        <td>${esc(nombreTrip(c.tripulante))}</td><td class="num">${c.seq}</td>
        <td class="hex">${c.perfil === 'eva' ? esc(c.hex.match(/../g).join(' ')) : esc(c.json)}</td>
        <td class="dec">${c.valores ? esc(Object.entries(c.valores).map(([k, v]) => `${k}=${v}`).join(' ')) : 'JSON'}</td></tr>`).join('')}</tbody></table>`
    : '<div class="vacio">Aún no llega ningún paquete de tramas crudas.</div>';
}

function vistaAlertas() {
  $('#barra').innerHTML = '<span>Alertas que LUNNA generó a bordo. Confirmar una abre el formulario para avisar a la tripulación.</span>';
  const vis = new Set(visibles());
  const lista = T.alertas.filter((a) => vis.has(a.tripulante));
  $('#vista').innerHTML = `<div style="padding:12px 14px">${lista.length ? lista.map((a) => `<div class="alerta ${esc(a.estado)}">
      <div class="cab"><div><span class="tag ${esc(a.estado)}">${esc(a.estado.toUpperCase())}</span> <b>${esc(nombreTrip(a.tripulante))}</b> · ${esc(nombreVar(a.variable))}</div>
      <button class="marcar" data-trip="${esc(a.tripulante)}" data-var="${esc(a.variable)}" data-txt="${esc(`LUNNA detectó ${nombreVar(a.variable)} en ${a.valor} ${unidad(a.variable)} (esperado ${a.esperado}). `)}" data-nivel="${esc(a.estado)}">Confirmar y alertar</button></div>
      <div class="meta">mediana 24 h ${esc(a.valor)} · esperado ${esc(a.esperado)} · banda [${esc((a.banda || []).join(' – '))}] · z = ${esc(a.z)} · P(normal) = ${esc(a.prob_nominal)}</div>
      <div class="meta">ocurrió ${hora(a.t_scet)} · recibida ${hora(a.t_ert)}</div></div>`).join('') : '<div class="vacio">Sin alertas de LUNNA.</div>'}</div>`;
  document.querySelectorAll('button.marcar').forEach((b) => b.addEventListener('click', () => prellenar(b.dataset.trip, b.dataset.var, b.dataset.txt, b.dataset.nivel)));
}

function pintarVista(forzar = false) {
  if (T.tab === 'crudos' && T.pausa && !forzar) return;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === T.tab));
  ({ procesados: vistaProcesados, crudos: vistaCrudos, alertas: vistaAlertas })[T.tab]();
}
function pintarContadores() {
  $('#n-procesados').textContent = Object.values(T.procesados).reduce((s, v) => s + Object.keys(v).length, 0);
  $('#n-crudos').textContent = T.crudos.length;
  $('#n-alertas').textContent = T.alertas.length;
}
function pintarEnviados() {
  $('#enviados').innerHTML = T.enviados.length ? T.enviados.map((a) => {
    const ac = T.acuses[a.id], d = a.datos ? JSON.parse(a.datos) : {};
    return `<div class="enviado"><div>${a.tipo === 'alerta' ? `<span class="tag ${esc(d.nivel)}">${esc(String(d.nivel).toUpperCase())}</span>` : '<span class="tag gris">AVISO</span>'}
        <b>${esc(a.para === 'todos' ? 'Toda la tripulación' : nombreTrip(a.para))}</b>${d.variable ? ` · ${esc(nombreVar(d.variable))}` : ''}</div>
      <div style="color:var(--dim);font-size:.84rem;margin-top:3px">${esc(a.texto)}</div>
      <div class="pasos"><span class="hecho">redactada ${hora(a.t_redactado)}</span>
        <span class="${a.t_envio ? 'hecho' : 'pend'}">${a.t_envio ? `enviada ${hora(a.t_envio)}` : 'en cola (ventana cerrada)'}</span>
        <span class="${ac ? 'hecho' : 'pend'}">${ac ? `recibida a bordo ${hora(ac.t_llegada)} · confirmado ${hora(ac.t_ert)}` : 'esperando confirmación de la nave'}</span></div></div>`;
  }).join('') : '<p class="nota">Ninguna todavía.</p>';
}
function pintarTodo() { pintarCabecera(); pintarTrip(); pintarContadores(); pintarVista(); pintarEnviados(); }

// ═══ alerta manual ═══
function prellenar(trip, variable, texto, nivel) {
  $('#f-para').value = trip; $('#f-var').value = variable ?? '';
  if (nivel === 'rojo' || nivel === 'ambar') $('#n-' + nivel).checked = true;
  const t = $('#f-texto'); t.value = texto ?? ''; t.focus(); t.setSelectionRange(t.value.length, t.value.length);
}
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const texto = $('#f-texto').value.trim(); if (!texto) { $('#f-texto').focus(); return; }
  const b = $('#f-enviar'); b.disabled = true;
  try {
    await api('/api/tierra/avisos', 'POST', { tipo: 'alerta', nivel: document.querySelector('input[name=nivel]:checked').value,
      para: $('#f-para').value, variable: $('#f-var').value || undefined, texto, de: 'Cirujano de vuelo' });
    $('#f-texto').value = '';
    await cargarEnviados();
  } catch (err) { alert('No se pudo enviar: ' + err.message); }
  b.disabled = false;
});
async function cargarEnviados() { T.enviados = await api('/api/tierra/avisos'); pintarEnviados(); pintarCabecera(); }

// ═══ arranque ═══
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { T.tab = b.dataset.tab; pintarVista(true); }));
(async () => {
  const [enlace, vars, trips, disps] = await Promise.all([api('/api/enlace'), api('/api/variables'), api('/api/tripulantes'), api('/api/dispositivos')]);
  T.enlace = enlace; T.trips = trips;
  for (const v of vars) T.vars[v.id] = v;
  for (const d of disps) T.disps[d.id] = d;
  $('#f-para').innerHTML = trips.map((t) => `<option value="${esc(t.id)}">${esc(t.nombre)}</option>`).join('') + '<option value="todos">Toda la tripulación</option>';
  $('#f-var').innerHTML = '<option value="">General (sin variable)</option>' + vars.map((v) => `<option value="${esc(v.id)}">${esc(v.nombre)}</option>`).join('');
  // Lo que ya había llegado antes de abrir la consola, en orden de llegada.
  const previos = (await Promise.all(['resumen', 'alerta', 'crudos', 'acuse'].map((t) => api('/api/tierra/bandeja?tipo=' + t)))).flat()
    .sort((a, b) => a.t_ert.localeCompare(b.t_ert) || a.id - b.id);
  for (const b of previos) recibir(b, false);
  await cargarEnviados();
  pintarTodo();
  const es = new EventSource('/api/stream');
  es.addEventListener('tierra', (e) => recibir(JSON.parse(e.data)));
  es.addEventListener('enlace', (e) => { T.enlace = JSON.parse(e.data); pintarCabecera(); });
  setInterval(pintarCabecera, 1000);
  setInterval(cargarEnviados, 3000);
})();
</script>
</body>
</html>
