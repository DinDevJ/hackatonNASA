<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVA · monitor de trama</title>
<style>
  :root { --bg:#0e1420; --panel:#172033; --linea:#28344d; --txt:#e8edf7; --suave:#93a1bd; --ok:#3ecf8e; --ambar:#f5b83d; --rojo:#ff5c6c; --info:#6aa8ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6fb; --panel:#fff; --linea:#d9dfec; --txt:#141b2b; --suave:#5b6880; --ok:#12915a; --ambar:#a86a00; --rojo:#c8283a; --info:#1f63c7; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 2px; } h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--suave); margin:26px 0 8px; }
  .sub { color:var(--suave); margin:0 0 16px; }
  .barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, select { font:inherit; color:var(--txt); background:var(--panel); border:1px solid var(--linea); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button.pri { background:var(--info); border-color:var(--info); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #estado { color:var(--suave); margin-left:auto; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .t { background:var(--panel); border:1px solid var(--linea); border-radius:10px; padding:10px 12px; }
  .t b { display:block; font-size:24px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .t span { color:var(--suave); font-size:12px; } .t small { color:var(--suave); font-size:11px; display:block; }
  .aviso { border-left:4px solid var(--ambar); background:var(--panel); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .aviso.rojo { border-color:var(--rojo); } .aviso.info { border-color:var(--info); }
  .aviso b { display:block; } .aviso small { color:var(--suave); }
  .bien { color:var(--ok); }
  pre { background:var(--panel); border:1px solid var(--linea); border-radius:10px; padding:10px 12px; margin:0; overflow-x:auto; font:12px/1.6 ui-monospace, Consolas, monospace; min-height:8.5em; }
  .nota { color:var(--suave); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>EVA · monitor de trama</h1>
  <p class="sub">Lo que llega por Bluetooth (<code>eva.ble.v1</code>), decodificado y evaluado en vivo.</p>

  <div class="barra">
    <button class="pri" id="bConectar">Conectar ESP32</button>
    <button id="bSimular">Simular sin placa</button>
    <select id="sEscenario" disabled aria-label="Escenario"></select>
    <span id="estado">Sin fuente</span>
  </div>

  <h2>Avisos</h2>
  <div id="avisos"><p class="sub">Aún no hay datos.</p></div>

  <h2>Persona</h2>
  <div class="grid" id="persona"></div>
  <h2>Cabina</h2>
  <div class="grid" id="cabina"></div>

  <h2>Últimos paquetes</h2>
  <pre id="crudo"></pre>
  <p class="nota">Línea base de la demo: FC en reposo 62 lpm, piel 33,6 °C. Con datos reales sale de los 14 días anteriores de cada persona.</p>
</main>

<script type="module">
import { UUID, ESCENARIO, decodificar, controlHora, controlEscenario, hex } from './trama.mjs';
import { Analizador } from './condiciones.mjs';
import { Simulador } from './simulador.mjs';

const $ = (id) => document.getElementById(id);
const PERSONA = [['fc', 'Frecuencia cardiaca', 'lpm', '04:A4'], ['spo2', 'SpO2', '%', '04:A3'], ['fr', 'Frec. respiratoria', 'rpm', '04:A2'],
  ['temp_piel', 'Temperatura de piel', '°C', '04:A1'], ['actividad', 'Actividad', 'cuentas/s', '03:V30'], ['postura', 'Postura', '', '01:V48'],
  ['rmssd', 'HRV (RMSSD 60 s)', 'ms', '03:V17'], ['calidad', 'Calidad de señal', '%', '']];
const CABINA = [['ppco2', 'CO2', 'mmHg', '04:A23'], ['ppo2', 'Oxígeno', 'mmHg', '04:A25'], ['temp_cabina', 'Temperatura', '°C', '04:A27'],
  ['humedad', 'Humedad', '%', '04:A27'], ['tasa_dosis', 'Tasa de dosis', 'µSv/h', '01:V95'], ['dosis', 'Dosis del evento', 'mSv', '01:V93'],
  ['ruido', 'Ruido', 'dBA', '04:A28'], ['lux', 'Luz', 'lux', '03:V49']];

const pintarGrid = (el, campos) => { el.innerHTML = campos.map(([k, n, u, id]) => `<div class="t"><span>${n}</span><b id="v_${k}">–</b><small>${u}${id ? ' · ' + id : ''}</small></div>`).join(''); };
pintarGrid($('persona'), PERSONA); pintarGrid($('cabina'), CABINA);
$('sEscenario').innerHTML = Object.keys(ESCENARIO).map((k) => `<option value="${k}">${k.replace('_', ' ')}</option>`).join('');

let an = new Analizador({ fc_reposo: 62, temp_piel: 33.6 });
let recibidos = 0, crudo = [], ibis = [], reloj = null, cControl = null, sim = null;

const poner = (k, x) => { const e = $('v_' + k); if (e) e.textContent = x == null ? '–' : typeof x === 'number' ? String(Math.round(x * 100) / 100).replace('.', ',') : String(x).replace('_', ' '); };

function recibir(bytes) {
  let p;
  try { p = decodificar(bytes); } catch (e) { crudo.unshift('✖ ' + hex(bytes) + '  ' + e.message); return pintar(); }
  recibidos++;
  an.ingerir(p);
  crudo.unshift(`${p.tipo.padEnd(8)} ${hex(bytes)}`);
  if (p.tipo === 'vitales') for (const [k] of PERSONA) if (k in p) poner(k, p[k]);
  if (p.tipo === 'latidos') {
    ibis.push(...p.ibi_ms); ibis = ibis.slice(-70);
    const d = ibis.slice(1).map((x, i) => x - ibis[i]);
    if (d.length > 20) poner('rmssd', Math.sqrt(d.reduce((a, b) => a + b * b, 0) / d.length));
  }
  if (p.tipo === 'habitat') { for (const [k] of CABINA) if (k in p) poner(k, p[k]); poner('dosis', an.dosisEvento_mSv); }
  $('estado').textContent = `${recibidos} paquetes · seq ${p.seq}${p.flags.simulado ? ' · simulado' : ''}${p.flags.relojSincronizado ? '' : ' · reloj sin poner'}`;
  pintar();
}

function pintar() {
  crudo = crudo.slice(0, 7);
  $('crudo').textContent = crudo.join('\n');
  const a = an.evaluar();
  $('avisos').innerHTML = a.length
    ? a.map((x) => `<div class="aviso ${x.nivel}"><b>${x.condicion}</b>${x.mensaje}<br><small>Umbral: ${x.origen}${x.variables.length ? ' · variables ' + x.variables.join(', ') : ''}</small></div>`).join('')
    : '<p class="sub bien">● Sin avisos: todo dentro de lo esperado.</p>';
}

function reiniciar() { an = new Analizador({ fc_reposo: 62, temp_piel: 33.6 }); recibidos = 0; crudo = []; ibis = []; }

$('bSimular').onclick = () => {
  clearInterval(reloj); reiniciar();
  sim = new Simulador({ t0: Math.floor(Date.now() / 1000) }); cControl = null;
  for (const b of sim.correr(120)) recibir(b); // dos minutos de historia para que las reglas tengan ventana
  reloj = setInterval(() => sim.paso().forEach(recibir), 1000);
  $('sEscenario').disabled = false; $('sEscenario').value = 'nominal';
};

$('bConectar').onclick = async () => {
  if (!navigator.bluetooth) { $('estado').textContent = 'Este navegador no tiene Web Bluetooth: usa Chrome o Edge.'; return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [UUID.servicio] }] });
    $('estado').textContent = 'Conectando…';
    const srv = await (await dev.gatt.connect()).getPrimaryService(UUID.servicio);
    clearInterval(reloj); sim = null; reiniciar();
    cControl = await srv.getCharacteristic(UUID.control);
    await cControl.writeValue(controlHora());
    const cTrama = await srv.getCharacteristic(UUID.trama);
    cTrama.addEventListener('characteristicvaluechanged', (e) => recibir(new Uint8Array(e.target.value.buffer)));
    await cTrama.startNotifications();
    dev.addEventListener('gattserverdisconnected', () => { $('estado').textContent = 'Desconectado'; $('sEscenario').disabled = true; });
    $('sEscenario').disabled = false; $('estado').textContent = `Conectado a ${dev.name}`;
  } catch (e) { $('estado').textContent = 'No se conectó: ' + e.message; }
};

$('sEscenario').onchange = async (e) => {
  if (sim) sim.cambiar(e.target.value);
  else if (cControl) await cControl.writeValue(controlEscenario(e.target.value));
};
</script>
</body>
</html>
