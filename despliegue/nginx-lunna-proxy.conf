# Lunna · cabeceras hacia el backend (conexión persistente) y de seguridad. instalar.sh lo copia a
# /etc/nginx/snippets/lunna-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
include snippets/lunna-cabeceras.conf;
# El backend permite CORS para el desarrollo local; en el VPS la landing y la API comparten origen, así que se
# quita: ninguna otra página puede usar el navegador de un visitante para escribir en la API de Lunna.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
