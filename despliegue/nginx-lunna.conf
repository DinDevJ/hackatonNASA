# Lunna en el VPS: la landing en «/» y todo lo demás al backend (modo simulación).
# instalar.sh sustituye __DOMINIO__, __DIR__ y __AUTH__ y lo copia a /etc/nginx/sites-available/lunna.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    client_max_body_size 5m;
    root __DIR__/landing;
    __AUTH__

    # ── Landing (archivos estáticos) ──
    location = /           { try_files /index.html =404; }
    location = /index.html { }
    location = /styles.css { }
    location = /main.js    { }
    location /video/       { alias __DIR__/video/; }

    # Página de estado del backend (la que antes se veía en «/»)
    location = /estado     { proxy_pass http://127.0.0.1:8787/; }

    # ── Eventos en vivo (SSE): sin búfer y con conexión larga ──
    location = /api/stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        add_header X-Accel-Buffering no;
    }

    # ── Todo lo demás: app, central, base, reloj, simulador y API ──
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
