# Lunna en el VPS: la landing en «/» y todo lo demás al backend (modo simulación).
# instalar.sh sustituye __PUERTO_WEB__, __DOMINIO__, __DIR__ y __PUERTO_BACKEND__ y lo copia a
# /etc/nginx/sites-available/lunna.
#
# Pensado para CONVIVIR con otros sitios en el mismo nginx: todo lo propio lleva el prefijo «lunna», no usa
# default_server y no cambia nada global (los límites y el upstream de abajo sólo los usa este sitio).

# ── Backend con conexiones persistentes (4 s < los 5 s de keep-alive de Node: evita 502) ──
upstream lunna_backend {
    server 127.0.0.1:__PUERTO_BACKEND__;
    keepalive 16;
    keepalive_timeout 4s;
}

# El subdominio «app.» abre directo en el simulador; el dominio principal, en la landing.
map $host $lunna_inicio { default ""; ~^app\. /simulador; }

# ── Micro-caché de 1 s para la API de lectura: si 100 visitantes piden lo mismo en el mismo segundo, el backend
#    responde una sola vez. No se guardan los eventos en vivo ni las escrituras. ──
proxy_cache_path /var/cache/nginx/lunna levels=1 keys_zone=lunna_cache:10m max_size=100m inactive=10m use_temp_path=off;

# ── Límites por IP. Generosos a propósito: en una sede muchos visitantes comparten la IP del Wi-Fi ──
map $request_method $lunna_ip_escritura { GET ""; HEAD ""; OPTIONS ""; default $binary_remote_addr; }
limit_req_zone  $binary_remote_addr  zone=lunna_lectura:10m   rate=300r/s;  # una sede entera puede salir por una IP
limit_req_zone  $lunna_ip_escritura  zone=lunna_escritura:10m rate=20r/s;   # sólo POST/PUT/DELETE
limit_req_zone  $binary_remote_addr  zone=lunna_reinicio:1m   rate=6r/m;
limit_conn_zone $binary_remote_addr  zone=lunna_conn_ip:10m;
limit_conn_zone $server_name         zone=lunna_conn_total:1m;

server {
    listen __PUERTO_WEB__;
    listen [::]:__PUERTO_WEB__;
    server_name __DOMINIO__;

    server_tokens off;
    charset utf-8;
    client_max_body_size 5m;
    root __DIR__/landing;
    limit_req_status 429;
    limit_conn_status 429;

    # Compresión de texto (Ubuntu sólo comprime HTML por defecto). Los eventos en vivo no se comprimen.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    open_file_cache max=200 inactive=60s;

    # ── Landing (archivos estáticos) ──
    location = /           { if ($lunna_inicio) { return 302 $lunna_inicio; } try_files /index.html =404; include snippets/lunna-cabeceras.conf; add_header Cache-Control "no-cache"; }
    location = /index.html { include snippets/lunna-cabeceras.conf; add_header Cache-Control "no-cache"; }
    location = /styles.css { include snippets/lunna-cabeceras.conf; add_header Cache-Control "no-cache"; }
    location = /main.js    { include snippets/lunna-cabeceras.conf; add_header Cache-Control "no-cache"; }
    location /recursos/    { include snippets/lunna-cabeceras.conf; add_header Cache-Control "public, max-age=86400"; }
    location /video/       { alias __DIR__/video/; include snippets/lunna-cabeceras.conf; add_header Cache-Control "public, max-age=86400"; }

    # Página de estado del backend (la que el backend sirve en «/»)
    location = /estado {
        limit_req zone=lunna_lectura burst=300 nodelay;
        proxy_pass http://lunna_backend/;
        include snippets/lunna-proxy.conf;
    }

    # ── Eventos en vivo (SSE): sin búfer, sin compresión y con conexión larga ──
    location = /api/stream {
        limit_conn lunna_conn_ip 400;       # una sede entera detrás de una IP
        limit_conn lunna_conn_total 3000;   # tope global para proteger al backend
        proxy_pass http://lunna_backend;
        include snippets/lunna-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
    }

    # Reiniciar la demo la borra para todos: pocas veces por minuto por IP
    location = /api/demo/reiniciar {
        limit_req zone=lunna_reinicio burst=3 nodelay;
        proxy_pass http://lunna_backend;
        include snippets/lunna-proxy.conf;
    }

    # API: lectura generosa; las escrituras en ráfaga se ponen en cola en vez de rechazarse
    # («Prepare mission» manda cientos de lotes seguidos).
    location /api/ {
        limit_req zone=lunna_lectura burst=1000 nodelay;
        limit_req zone=lunna_escritura burst=1000;
        proxy_pass http://lunna_backend;
        include snippets/lunna-proxy.conf;
        proxy_cache lunna_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status;
    }

    # Archivos de las interfaces: caché corta en el navegador (al bajar por la landing se recargan)
    location ~ ^/(app|reloj|interfaces)/.+\.(js|css|webp|png|jpg|svg|woff2?)$ {
        limit_req zone=lunna_lectura burst=1000 nodelay;
        proxy_pass http://lunna_backend;
        include snippets/lunna-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Todo lo demás: app, central, base, reloj y simulador ──
    location / {
        limit_req zone=lunna_lectura burst=1000 nodelay;
        proxy_pass http://lunna_backend;
        include snippets/lunna-proxy.conf;
    }
}
